# 신호 주입 케이스 — camera_judgment 의 ★변환 수학★ 을 영상·YOLO 없이 격리 검증
#
# 입력은 /lane/state 의 lane_vote 결과(미터 단위)다. 예전 판과 달리 다항식이 아니다.
#
# ★기댓값은 대상 코드에서 베낀 것이 아니라 기하로 유도한 것이다.★
#   차선 중심선   y_c(x) = d + tan(ψ)·x + ½·κ·x²      (좌측 +, 뒷차축 원점)
#   cte_rear      = y_c(0)      = d
#   cte_near      = y_c(d_near)
#   d_near        = bev_bottom_ahead_rear_m + bev_h·(1 − bottom_ratio)·px2m
#                 = 0.55 + 480×0.08×0.007 = 0.55 + 0.2688 = ★0.8188 m★
#   theta_deg     = degrees(ψ) + cam_yaw_offset_deg(0)
#   curvature     = κ  (부호 그대로 — 예전 판의 |a| 와 다르다)
#
# ★부호 규약★ d>0 = 차량이 차선중심 우측 = /lane_metrics 의 GPS 규약(우측 +).
#   camera_judgment 는 이 부호를 ★다시 뒤집지 않는다★ — 뒤집으면 이 파일이 잡는다.
#
# ⚠ 케이스 순서는 cte_near 가 연속 케이스 간 jump_max_m(0.35) 을 넘지 않게 짰다.
#   넘으면 F_JUMP 가 서서 conf_eff 가 0 이 되고, 그건 게이트가 맞게 도는 것이지
#   변환이 틀린 게 아니다(마지막 그룹은 conf_eff=0 을 일부러 기대하는 케이스들).

cases:
  # ── 1. 영점 ─────────────────────────────────────────────────────
  - name: 영점
    desc: d=ψ=κ=0 → 모든 출력이 0. 폭만 그대로 통과한다.
    input: {vote_d: 0.0, vote_psi: 0.0, vote_kappa: 0.0, vote_width: 3.0,
            conf: 1.0, left_ok: 1, right_ok: 1}
    expect: {cte_rear_m: 0.0, cte_near_m: 0.0, theta_deg: 0.0,
             curvature: 0.0, lane_width_m: 3.0, conf_eff: 1.0, flags: 0}
    tol: {_default: 0.0005}

  # ── 2. 횡오차 부호 (★여기가 틀리면 조향이 반대로 간다★) ──────────
  - name: d_우측_0.3
    desc: >
      d=+0.3 = 차량이 차선중심보다 0.3m 우측. ψ=κ=0 이므로 근점도 같은 값.
      /lane_metrics 의 우측+ 규약과 같은 부호여야 한다.
    input: {vote_d: 0.3, vote_psi: 0.0, vote_kappa: 0.0, vote_width: 3.0,
            conf: 1.0, left_ok: 1, right_ok: 1}
    expect: {cte_rear_m: 0.3, cte_near_m: 0.3, theta_deg: 0.0}
    tol: {_default: 0.0005}

  - name: 복귀_0
    input: {vote_d: 0.0, vote_psi: 0.0, vote_kappa: 0.0, vote_width: 3.0,
            conf: 1.0, left_ok: 1, right_ok: 1}
    expect: {cte_rear_m: 0.0, cte_near_m: 0.0}
    tol: {_default: 0.0005}

  - name: d_좌측_0.3
    desc: d=−0.3 = 차량이 차선중심보다 0.3m 좌측. 대칭이어야 한다.
    input: {vote_d: -0.3, vote_psi: 0.0, vote_kappa: 0.0, vote_width: 3.0,
            conf: 1.0, left_ok: 1, right_ok: 1}
    expect: {cte_rear_m: -0.3, cte_near_m: -0.3, theta_deg: 0.0}
    tol: {_default: 0.0005}

  - name: 복귀_0_다시
    input: {vote_d: 0.0, vote_psi: 0.0, vote_kappa: 0.0, vote_width: 3.0,
            conf: 1.0, left_ok: 1, right_ok: 1}
    expect: {cte_rear_m: 0.0}
    tol: {_default: 0.0005}

  # ── 3. 헤딩오차 (gps_imu 가 쓰는 유일한 값) ──────────────────────
  - name: psi_10도
    desc: >
      ψ = 0.1745329 rad = 10.0°. theta_deg 는 그대로 10.0 이어야 하고,
      cte_near = 0 + tan(10°)×0.8188 = 0.176327×0.8188 = 0.144377 m.
      ★gps_imu 는 theta_deg 하나만 쓴다 — 여기가 틀리면 헤딩 보정이 통째로 틀린다★
    input: {vote_d: 0.0, vote_psi: 0.1745329, vote_kappa: 0.0, vote_width: 3.0,
            conf: 1.0, left_ok: 1, right_ok: 1}
    expect: {theta_deg: 10.0, cte_rear_m: 0.0, cte_near_m: 0.144377}
    tol: {theta_deg: 0.01, _default: 0.0005}

  - name: psi_음5도
    desc: ψ = −0.0872665 rad = −5.0°. cte_near = −tan(5°)×0.8188 = −0.071634.
    input: {vote_d: 0.0, vote_psi: -0.0872665, vote_kappa: 0.0, vote_width: 3.0,
            conf: 1.0, left_ok: 1, right_ok: 1}
    expect: {theta_deg: -5.0, cte_near_m: -0.071634}
    tol: {theta_deg: 0.01, _default: 0.0005}

  # ── 4. 곡률 (★부호가 살아 있어야 한다★) ─────────────────────────
  - name: kappa_좌회전
    desc: >
      κ=+0.05 (좌회전), d=+0.1, ψ=0.
      cte_near = 0.1 + ½×0.05×0.8188² = 0.1 + 0.025×0.670433 = 0.116761 m.
      curvature 는 κ 를 부호 그대로 낸다 — 예전 판은 |a| 라 부호가 없었다.
    input: {vote_d: 0.1, vote_psi: 0.0, vote_kappa: 0.05, vote_width: 3.0,
            conf: 1.0, left_ok: 1, right_ok: 1}
    expect: {cte_rear_m: 0.1, cte_near_m: 0.116761, curvature: 0.05}
    tol: {_default: 0.0005}

  - name: kappa_우회전
    desc: κ=−0.05 → curvature 도 −0.05. cte_near = 0.1 − 0.016761 = 0.083239.
    input: {vote_d: 0.1, vote_psi: 0.0, vote_kappa: -0.05, vote_width: 3.0,
            conf: 1.0, left_ok: 1, right_ok: 1}
    expect: {cte_near_m: 0.083239, curvature: -0.05}
    tol: {_default: 0.0005}

  # ── 5. 게이트 (여기부터는 conf_eff=0 을 ★일부러★ 기대한다) ───────
  - name: 폭_게이트_탈락
    desc: width=1.0 < width_min_m(1.8) → F_WIDTH_BAD(2) → conf_eff=0.
    input: {vote_d: 0.1, vote_psi: 0.0, vote_kappa: 0.0, vote_width: 1.0,
            conf: 1.0, left_ok: 1, right_ok: 1}
    expect: {conf_eff: 0.0, conf_raw: 1.0, lane_width_m: 1.0}
    tol: {_default: 0.0005}

  - name: conf_게이트_탈락
    desc: conf=0.10 < conf_min(0.15) → F_CONF_LOW(8) → conf_eff=0. conf_raw 는 살아 있다.
    input: {vote_d: 0.1, vote_psi: 0.0, vote_kappa: 0.0, vote_width: 3.0,
            conf: 0.10, left_ok: 1, right_ok: 1}
    expect: {conf_eff: 0.0, conf_raw: 0.10}
    tol: {_default: 0.0005}

  - name: 단독차선은_치명이_아니다
    desc: >
      한쪽만 보이면 F_SINGLE(16) 이 서지만 ★치명 게이트가 아니다★ —
      폭 가정으로 세운 d 는 여전히 쓸 만하므로 conf_eff 가 살아 있어야 한다.
    input: {vote_d: 0.1, vote_psi: 0.0, vote_kappa: 0.0, vote_width: 3.0,
            conf: 0.6, left_ok: 1, right_ok: 0}
    expect: {conf_eff: 0.6, flags: 16}
    tol: {_default: 0.0005}

  - name: 차선없음
    desc: 좌우 둘 다 못 봄 → F_NO_LANE(1) → conf_eff=0.
    input: {vote_d: 0.1, vote_psi: 0.0, vote_kappa: 0.0, vote_width: 3.0,
            conf: 0.0, left_ok: 0, right_ok: 0}
    expect: {conf_eff: 0.0, flags: 9}
    tol: {_default: 0.0005}
