# ══════════════════════════════════════════════════════════════════════════
#  실차 야간 영상 A — ★정지선 「2단계 정지」 시험★ (STOPLINE_TEST.md 단계 4)
# ══════════════════════════════════════════════════════════════════════════
#  이 파일이 묻는 것 : "★정지선을 보고 1단 → 2단으로 서는가★"
#
#  ── stopline_night_a.yaml 과 무엇이 다른가 ─────────────────────────────
#    stopline_night_a       : "무엇을 정지선으로 보는가"      (인지 시험, lockstep)
#    이 파일                 : "그래서 올바른 순서로 무는가"   (판단 시험, realtime)
#
#  ★[2026-08-25 신설] 왜 새 파일이 필요했나★
#  stopline_night_a 는 정지선 경로를 ★구조적으로 밟을 수 없다★. 목업을 프레임 0부터
#  고정으로 붙이기 때문에 RED 가 즉시 확정되고, 우리 차선 정지선(프레임 542~621)이
#  나오기 ★20초 전에 이미 2단이 물린다★. 그래서 그 파일의 정지 근거는 전부
#  [정지선 없음] 이고 [예비제동]·[정지선 앞] 은 한 번도 안 나온다.
#  → ★목업을 정지선 직전에만 켜는 것★ 이 이 파일의 전부다(아래 overlay 의 from/to).
#
#  ── ★잴 수 있는 것과 없는 것 — 먼저 읽을 것★ ──────────────────────────
#  ★잰다★   : 판단이 ★올바른 순서로 올바른 지점에서★ 났는가
#              (1단이 2단보다 먼저 · 정지선을 보고 물었는가 · 상한으로 때운 것은 아닌가)
#  ★못 잰다★ : ★차가 정지선 앞에 실제로 섰는가★
#              영상은 브레이크와 무관하게 계속 흐른다. 노드가 2단을 물어도 화면
#              속의 차는 정지선을 지나 계속 간다. 그것은 녹화 재생의 한계이지
#              노드의 잘못이 아니므로 ★여기서 판정하지 않는다★.
#              실제 정지 위치는 실차 단계 4 에서 눈으로 확인할 것.
# ══════════════════════════════════════════════════════════════════════════
name: stopline_approach_night_a
contract: contracts/white1_stopline.yaml

video: night_a          # 1920x1080 · 30.02fps · 1292프레임 · 43.0초

# ── 재생 ───────────────────────────────────────────────────────────────
#   ★realtime 이다★ stopline_night_a 가 lockstep 인 것과 다르다. 이유는 이 시나리오가
#   ★시간 판정★ 이기 때문이다 — 이 노드의 판단은 전부 벽시계로 돈다
#   (tl_hold_s 0.4s · sl_stale_s 0.5s · sl_wait_max_s 8s).
#
#   ⚠️ ★lockstep 으로 돌리면 안 된다★ lockstep 은 프레임당 처리시간(≈0.1s)이 그대로
#      흘러 벽시계가 장면시간의 ★약 3배★ 로 간다. 그러면 sl_wait_max_s(8초)가
#      2단 문턱에 닿기 ★전에★ 터져서, 정지가 [대기 상한] 으로 때워진다 —
#      측정하려던 성공 경로가 사라진다.
#   ⚠️ ★그 대신 상수를 늘려서 맞추지 말 것★ sl_wait_max_s 를 24초로 올리면 숫자는
#      통과하지만 그것은 ★실차에서 쓰지 않는 값★ 이다. 모드를 맞추는 쪽이 옳다.
#
#   대가는 표본이다 — 1080p 두 번 추론이 30fps 를 못 따라가 프레임의 2/3 을 흘린다.
#   그래도 우리 차선 정지선 통과(542~621 = 2.6초)에서 ★25프레임쯤★ 은 처리되므로
#   sl_hold_s(0.2초)·문턱 통과를 보기에 충분하다.
mode: realtime
start: 0
limit: 0
stride: 1
warmup_s: 15.0          # YOLO 를 ★둘★ 로드한다(신호등 + 정지선)
discard_first: 5
sync_settle_ms: 60      # 계약 §3 — 동기 토픽이 거리보다 먼저 나간다

# ── 합성 자극 : 목업 신호등 ────────────────────────────────────────────
#   ★이 파일의 핵심은 from/to 다★ 이 영상에는 신호등이 한 번도 안 나오므로 목업이
#   필요한데(없으면 _sl_should_run 게이트가 안 열려 정지선 추론이 아예 안 돈다),
#   ★언제 켜느냐★ 가 시험의 성패를 가른다.
#
#   ⚠️ ★[2026-08-25 첫 런에서 배운 것] 너무 «일찍» 켜면 시험이 죽는다★
#      from: 0.40(프레임 517)으로 처음 돌렸더니 [예비제동]·[정지선 앞] 이 둘 다 0 이
#      나왔다. 순서를 보면 이유가 그대로 보인다:
#          f517 목업 ON → f530 RED 확정 → _stop_plan 이 도는데 sl_px = −1
#                       → ★[정지선 없음] → 즉시 2단★
#          f543 그제서야 정지선이 잡힌다 — 그러나 ★단계는 올라가기만 한다★
#                       (2단을 물었으니 1단으로 못 내려간다) → 경로가 통째로 죽는다
#      ★그래서 목업은 정지선이 «이미 보이는» 시점에 켜야 한다★:
#          목업 ON(F) → RED 확정 F+12프레임(tl_hold_s 0.4s × 30fps)
#          정지선 검출은 542부터, 확정은 +6프레임(sl_hold_s 0.2s) = 548
#          → ★F + 12 > 548, 즉 F > 536★ 이어야 _stop_plan 이 정지선을 보고 판단한다
#
#     from: 0.42  → 프레임 ≈ 543.  위 조건을 만족하는 가장 이른 지점이다.
#                   RED 확정 ≈ f555 이고 그때 sl_px ≈ 641 이라 문턱 밖 → [대기](0단),
#                   이어서 1단(≤470) ≈ f583, 2단(≤300) ≈ f614 로 ★순서대로★ 간다.
#
#   ⚠️ ★이것은 지그의 한계이지 노드의 버그가 아니다 — 다만 실차에서 확인할 것이 하나 있다★
#      실물 신호등은 멀면 박스가 작아 RED_FAR 로 빠지고, 가까워져야 RED 가 된다
#      (근접도 게이트 tl_red_stop_min_height). 그 게이트가 열리는 거리가
#      ★정지선이 보이기 시작하는 거리(범퍼 앞 5.3m)보다 멀면★ 실차에서도 똑같이
#      [정지선 없음] 으로 즉시 2단이 된다. 목업은 크기가 고정이라 이 순서를
#      재현하지 못하므로, ★그 확인은 실차 단계 4 의 몫이다★.
#     to:   0.52  → 프레임 ≈ 672.  정지선을 지난 뒤 끈다. 두 가지를 얻는다:
#                   ① 해제 경로(release_red_gone)를 함께 보게 된다
#                   ② 둘째 교차로(673~736)의 ★반대편 차선★ 정지선에 반응하는 것을
#                      이 시험에서 떼어 낸다 — 그건 별개 과제다(아래 ⚠️).
#
#   ⚠️ ★프레임 번호는 이 영상·이 stride 에 묶인다★ video 나 stride 를 바꾸면
#      from/to 를 다시 잡아야 한다. 진행률 t 의 분모는 ★투입 장수★ 다(1292).
#   ⚠️ ★이것은 정답을 주는 장치가 아니다★ 합성한 그림을 노드의 YOLO 가 실제로
#      검출해야 아무 일이든 일어난다. 그림이 시원찮으면 '검출 0회' 로 남는다.
#   ★목업을 폐지하고 박스 높이를 직접 준다 [2026-08-25]★ from/to 로 «언제» 를 잡던
#   것을 aux_schedule 로 옮긴다 — 위 프레임 계산(RED 확정 F+12 > 정지선 확정 548)은
#   그대로 유효하다. 목업 검출의 불확실성(그림·밝기·크기)이 없어져 타이밍이 재현된다.
aux_schedule:
  # {프레임: 박스높이px}  35 = RED(≥25)이되 코앞-override 는 안 걸리는 높이.
  #   543: 정지선이 이미 보이는 시점에 켠다(위 «너무 일찍 켜면 죽는다» 참고).
  #   672: 정지선을 지난 뒤 끈다 — 해제 경로를 보고, 둘째 교차로 정지선을 떼어 낸다.
  #   ★35 를 고른 이유★ RED 확정은 ≥25(tl_red_stop_min_height, ★실차값 그대로★)면
  #   되고, 코앞 상한은 아래 ratio 로 25×0.7×3.0=52.5px 라 35 는 그 아래다. 그래서
  #   RED 는 확정되되 [신호등 코앞] 으로 새지 않아, 1단→2단이 ★sl_px 로만★ 갈린다.
  "/tl/fake_box_h": {0: 0.0, 543: 35.0, 672: 0.0}

params:
  traffic_light:
    show_window: false
    # ── ★고정 크기 주입이 코앞-override 를 건드리지 않게 한다★ ─────────
    #   주입 박스는 크기가 고정(35px)이라 '가까워질수록 커진다' 를 흉내내지 못한다.
    #   기본 ratio(1.6)면 상한이 25×0.7×1.6=28px 라, 1단을 무는 순간(_near_gate 가
    #   0.7배로 내려감) 35 가 28 을 넘어 ★[신호등 코앞] 으로 2단 직행★ 한다 —
    #   재려던 1단→2단 순서가 죽는다. 3.0 으로 올리면 상한이 52.5px 라 35 가 안전하다.
    #   ★이 시나리오는 override 자체를 시험하지 않는다★ (고정 자극으로는 불가능하다) —
    #   sl_px 로 갈리는 단계 순서를 재려고 override 를 비켜 둘 뿐이다. 실물 신호등의
    #   근접 override 는 실차 단계 4 의 몫이다(위 ⚠️).
    #   ⚠️ tl_red_stop_min_height 는 ★건드리지 않는다★ — RED/RED_FAR 를 가르는 그
    #      문턱이야말로 실차에서 그대로 쓰는 값이라 여기서 옮기면 시험이 무의미해진다.
    sl_override_gate_ratio: 3.0
    # ⚠️ ★그 밖의 값은 일부러 비워 둔다★ 특히 bev_bumper_y_px(645) ·
    #    sl_brake1_px(470) · sl_brake2_px(300) 은 ★노드 기본값을 그대로 시험한다★.
    #    여기서 덮으면 '실차에 들어갈 값' 이 아니라 '이 시험용 값' 을 재게 된다.

variants:
  - {name: base, perturb: none}

# ── 판정 ───────────────────────────────────────────────────────────────
#   ⚠️ ★[2026-08-25] 아래 하한들은 «설계 의도» 이지 실측값이 아니다★ 이 시나리오는
#      오늘 처음 만든 것이라 realtime 실측이 아직 없다. 첫 런의 값이 나오면 그
#      근거로 ★조인다★(느슨하게 하지 말 것). 특히 min: 1 들은 '한 번은 나와야
#      한다' 는 최소 요구이고, 실측이 나오면 구간·횟수로 바꾸는 것이 맞다.
checks:
  # ── 단계 0 : 노드가 제대로 떴는가 ────────────────────────────────────
  - {stat: "log:boot_sl_class", min: 1,
     why: "0-1 정지선 클래스표에 stop-line 이 있고 그 id 를 쓴다"}
  - {stat: "log:boot_sl_on", min: 1,
     why: "0-2 정지선 배너가 나온다 (꺼져 있으면 이 시험이 통째로 무의미하다)"}
  - {stat: "log:boot_undistort_on", min: 1,
     why: "0-3 카메라 보정 ON — OFF 면 BEV 거리를 믿을 수 없다"}
  - {stat: "log:boot_weight_fail", max: 0,
     why: "0-1 .engine 은 빌드한 GPU 에 묶인다 — 안 열리면 이 기계에서 다시 빌드할 것"}
  - {stat: "log:boot_class_missing", max: 0,
     why: "★여기서 멈춘다★ 다른 클래스를 정지선으로 읽으면 엉뚱한 곳에서 선다"}

  # ── 시험이 성립하는가 : 자극이 제때 들어왔는가 ───────────────────────
  #   ★이것이 떨어지면 아래 판정은 읽을 가치가 없다★
  - {stat: "log:boot_inject", min: 1,
     why: "주입이 켜져 있는가(tl_fake_box_h>0). 없으면 aux_schedule 가 안 닿은 것"}
  - {where: "tl_state == 'RED'", stat: count, min: 15,
     why: "★주입이 켜진 구간(프레임 543~672)에서 RED 가 확정돼야 한다★ 35px 는
           실차 문턱(25) 이상이라 RED 다. realtime 은 프레임의 2/3 을 흘리므로 그
           130프레임 중 처리되는 것은 40프레임쯤이다. 15 는 '확정이 한동안
           유지됐다' 의 하한이다"}
  - {stat: "log:near_override", max: 0,
     why: "★[신호등 코앞] 으로 새면 안 된다★ 35px 는 코앞 상한(25×0.7×3.0=52.5)
           아래라 override 가 안 걸려야 한다. 걸렸다면 sl_override_gate_ratio 가
           안 먹었거나 검출기가 진짜 큰 빨간 박스를 겹쳐 본 것 — 정지선 경로를
           한 번도 안 밟아 이 시험이 공허해진다"}

  # ── ★본론★ 정지선을 보고 1단 → 2단으로 섰는가 ───────────────────────
  - {where: "sl_px >= 0", stat: count, min: 10,
     why: "★정지선을 보긴 했는가★ 목업이 켜진 구간에 우리 차선 정지선(542~621)이
           들어 있다. realtime 표본 감소를 감안한 하한이다.
           ⚠️ 0 이면 아래 두 판정은 원인이 여기지 노드 판단이 아니다"}
  - {stat: "log:stop_pre", min: 1,
     why: "★1단 예비제동을 «정지선을 보고» 물었는가★ [예비제동] 은 sl_px 가
           sl_brake1_px(470 = 범퍼 앞 4.0m) 안으로 들어왔을 때만 나온다.
           이것이 0 이면 2단계 정지의 앞 단계가 죽어 있는 것이다"}
  - {stat: "log:stop_at_line", min: 1,
     why: "★이것이 성공 경로다★ [정지선 앞] 은 sl_px 가 sl_brake2_px(300 = 범퍼 앞
           2.34m) 안에서 2단을 문 것이다. stopline_night_a 에서는 이 로그가 한 번도
           안 나왔고, 그것이 이 파일을 만든 이유다"}
  - {stat: "log:wait_cap", max: 0,
     why: "★[대기 상한] 은 실패다★ 8초가 차서 정지선을 무시하고 2단으로 때웠다는
           뜻이므로, 거리 판단이 아니라 시계가 정지를 만든 것이다.
           ⚠️ 이것이 뜨면 제일 먼저 mode 가 realtime 인지 볼 것(위 재생 절)"}

  # ── 개입의 단조성 (영상과 무관하게 성립해야 하는 불변식) ─────────────
  - {signal: brake_level, stat: decreases, max: 1,
     why: "4-6 리니어는 물리적으로 왕복하는 장치이고 그 왕복이 제일 나쁜 고장
           모드다. 목업을 to: 에서 끄므로 해제(→0)가 1회 일어난다"}
  - {where: "sl_wait and brake_level > 0", stat: count, max: 0,
     why: "4-2 정지선을 기다리는 동안(아직 0단) 물렸다면 다른 발행자가 문 것이다"}

  # ── 4-12 처리율 ─────────────────────────────────────────────────────
  - {stat: latency_p95_ms, max: 400,
     why: "4-12 이보다 늦으면 확정 시간(0.4s)을 못 채워 신호등에서 못 선다"}

# ── 회귀 허용오차 ──────────────────────────────────────────────────────
#   ⚠️ ★realtime 이라 기준(baseline) 등록에 주의할 것★ 어느 프레임이 처리되고 어느
#      것이 흘려지는지가 기계·부하에 따라 달라진다. 값이 정확히 재현되지 않으므로
#      lockstep(stopline_night_a) 처럼 조이면 안 된다. 이 파일에서 재현되는 것은
#      ★판단의 순서와 유무★ 이지 프레임별 숫자가 아니다.
compare_tol:
  _default: 1.0e-3
  sl_px: 20.0
  sl_y:  0.05
  tl_near: 5.0
