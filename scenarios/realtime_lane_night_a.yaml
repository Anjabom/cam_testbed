# ★realtime_lane_night_a★ — scenarios/lane_night_a.yaml 를 본으로 떠서 만들었다 (2026-08-31 14:07)
#   영상 night_a (/home/anjabom/video/cam-20260824_201445.mp4)
#   실차 카메라로 촬영: 예
#   ⚠️ 본의 판정 기준을 그대로 물려받았다 — 이 영상에 맞는지 확인할 것.
# 차선 알고리즘(perception + camera_judgment) 시험 — 실차 야간 영상 A
#   regression.yaml 은 실내 모형 트랙(track_a) 용이라 차선폭 규격이 다르다.
#   이 파일은 실차 카메라로 찍은 실도로 영상이라 local.yaml 의 실차 기본값
#   (lane_width_m 3.0, width_min/max 는 노드 기본값)을 그대로 쓴다 — 덮어쓰지 않는다.
name: realtime_lane_night_a
contract: contracts/white_camera.yaml

video: night_a          # ★논리 이름★ 실제 경로는 local.yaml 의 videos:
                         #   1920x1080 · 30.02fps · 1292프레임 · 43.0초
                         #   ★실차 카메라로 찍은 영상이다★ (차체·앞바퀴가 화면에 있다)
                         #   신호등·정지선은 안 나온다(stopline_night_a 참조) — 차선 시험엔 무관.

mode: realtime
start: 0
limit: 0                 # 0 = 끝까지 — 전 구간의 차선 인지 품질을 본다
stride: 1
warmup_s: 8.0            # YOLO 로딩 여유 (차선 세그 모델 1개만 로드)
sync_timeout: 4.0
discard_first: 5         # YOLO 첫 추론 지연 로딩분은 통계에서 뺀다

params:
  perception:
    show_window: false
    record_video: false
    enable_undistort: true
    ipm_src_pts: [720.0, 650.0, 1200.0, 650.0, 1920.0, 1080.0, 0.0, 1080.0]
    lane_roi_xmin: 0
    lane_roi_ymin: 600
    lane_roi_xmax: 1920
    lane_roi_ymax: 1080
    tl_roi_xmin: 0
    tl_roi_ymin: 0
    tl_roi_xmax: 1920
    tl_roi_ymax: 600
    pixel_to_meter_bev: 0.007
    lane_width_m: 3.0
  camera_judgment:
    pixel_to_meter_bev: 0.007
    lane_width_m: 3.0

variants:
  - {name: base, perturb: none}

# ── 불변식 체크 : 진실을 몰라도 성립해야 하는 것들 ──────────────────
#   regression.yaml 과 같은 기준(실차 규격 기준) — 모형 트랙 전용 오버라이드가 없다.
checks:
  - {stat: drop_rate,        max: 0.02, why: "lockstep 인데 프레임이 새면 동기 실패"}
  - {stat: latency_p95_ms,   max: 600,  why: "프레임당 처리 지연"}
  - {signal: conf_raw,  stat: frac_nonzero, min: 0.5,
     why: "절반 이상 프레임에서 차선을 봐야 한다"}
  - {signal: lane_width_m, stat: mean, min: 2.0, max: 4.5, when_valid: true,
     why: "차선폭은 물리량이다 — 평균이 이 밖이면 px2m/IPM 캘리브가 틀렸다"}
  - {signal: lane_width_m, stat: std,  max: 0.6, when_valid: true,
     why: "같은 도로에서 폭이 흔들리면 fit 이 흔들린 것"}
  - {signal: theta_deg, stat: p95_abs_diff, max: 8.0,
     why: "θ 가 프레임 간 8도씩 튀면 IMU 보정에 못 쓴다"}
  - {signal: cte_rear_m, stat: p95_abs_diff, max: 0.35,
     why: "camera_judgment 의 jump_max_m 과 같은 뜻"}
  - {stat: "contribution:gps_imu_heading", min: 0.30,
     why: "GPS/IMU 헤딩 보정에 실제로 반영되는 프레임 비율"}
  - {stat: "contribution:judgment_gate", min: 0.50,
     why: "camera_judgment 치명 게이트를 통과하는 비율"}
  - {stat: "theta:abs_bias_deg", max: 1.0,
     why: "직진에서 편향이 있으면 헤딩이 계속 한쪽으로 끌린다"}
  - {stat: "theta:vibration_frac", max: 0.15,
     why: "조향 진동 대역 파워. 크면 카메라가 진동을 만든다"}
  - {stat: "flag_rate:WIDTH_BAD", max: 0.30}
  - {stat: "flag_rate:CTE_JUMP",  max: 0.10}

# ── 회귀 허용오차 : 이보다 크게 바뀌면 DIFF ────────────────────────
compare_tol:
  _default: 1.0e-6      # 기본은 완전 일치 요구
  cte_rear_m:   0.005   # [m]
  cte_near_m:   0.005
  theta_deg:    0.20    # [deg]
  conf_raw:     0.01
  conf_eff:     0.01
  lane_width_m: 0.02
  curvature:    0.02
  half_width_px: 1.0
  flags:        0.0     # 플래그는 한 프레임도 달라지면 안 된다
