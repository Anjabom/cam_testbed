# BEV 마스크 덤프 전용 — 오프라인 파라미터 튜닝(bench/*.py)의 입력을 만든다.
#   판정이 목적이 아니다. checks 를 비워 둔 이유가 그것이다.
#   덤프는 ★블러 전 uint8★ 이라 sigma_px 까지 오프라인에서 스윕할 수 있다.
#
#   python3 -m tb.run run --scenario scenarios/vote_dump.yaml --tag dump
#   python3 bench/profile_range.py --data <dump_dir>          # §11-2
#   python3 bench/sweep.py --data <dump_dir> --param x_sample_max --range ...
name: vote_dump_b
contract: contracts/white_vote.yaml

video: night_b
mode: lockstep
start: 0
limit: 0
stride: 1
warmup_s: 8.0
sync_timeout: 4.0
discard_first: 5

params:
  perception:
    show_window: false
    record_video: false
    enable_undistort: true
    # ★세션 스크래치패드에 두지 않는다★ — 이전 값(/tmp/claude-.../scratchpad)은
    #   세션이 끝나며 통째로 사라져 s_ref 를 재려 할 때 덤프가 없었다.
    #   runs/ 는 .gitignore 대상이라 저장소를 더럽히지 않으면서 남는다.
    dump_bev_dir: /home/anjabom/cam_testbed/runs/_bevdump_b
  camera_judgment: {}

variants:
  - {name: base, perturb: none}

checks: []
