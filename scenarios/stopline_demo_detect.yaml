# ══════════════════════════════════════════════════════════════════════════
#  ⚠️ ★이것은 track_record.mp4 전용 「지그」다★ — 실차 판정용이 아니다
# ══════════════════════════════════════════════════════════════════════════
#  이 파일의 프레임 구간·목업 크기·두 문턱·근접도 문턱은 전부 ★그 영상 하나에서
#  뽑은 값★ 이다. 그 영상은 실차와 카메라 위치·화각이 다르므로, 여기서 나온 숫자로
#  white1 을 튜닝하면 안 된다(2026-08-19 지시).
#
#  ★그럼 왜 남겨 두는가★ 둘이다:
#    ① 테스트베드 자신의 회귀 — 판정 엔진·계약·화면이 성한지 매번 확인한다
#    ② README §12 의 발견 사항 4개를 ★다시 돌려 볼 수 있는 유일한 절차★ 다
#
#  ★실차 카메라로 찍은 새 영상은 scenarios/stopline_field.yaml 로 돌린다★
#  (그쪽은 합성 목업도, 이 영상용 지그 값도 쓰지 않는다)
# ══════════════════════════════════════════════════════════════════════════
# ══════════════════════════════════════════════════════════════════════════
#  단계 1 — ★정지선이 화면에 잡히는가★  (STOPLINE_TEST.md 의 관문)
# ══════════════════════════════════════════════════════════════════════════
#  절차서가 못을 박아 둔 그대로다:
#     "구 white 실측에서 stop_line_dist 는 100% 미검출이었다. ★여기서 안 잡히면
#      나머지 단계는 할 필요가 없다★ — sl_enable:=false 로 두고 접으면 종전 동작이다."
#  그 질문을 차를 꺼내지 않고 ★영상 하나로★ 묻는다.
#
#  ★고른 구간의 근거★ track_record.mp4 의 1354~1402 프레임에 실제 정지선 접근이
#  있다(사전 스캔: 검출이 거의 매 프레임, 마스크 최하단 y 가 804 → 1080 으로 단조
#  증가 = 다가가는 중). 그 앞뒤를 조금씩 물려 1340~1429 를 본다.
#
#  ★왜 목업 신호등을 합성하는가★ 이 노드는 ★빨간 박스를 본 적이 있어야만★ 정지선
#  추론을 돌린다(_sl_should_run 이 red_seen_t > 0 을 요구한다). 손에 있는 영상에는
#  신호등이 없으므로 sl_gate_red_s 를 아무리 크게 줘도 관문이 안 열린다
#  (⚠️ 절차서 단계 1 의 `sl_gate_red_s:=99999.0` 한 줄로는 부족하다 — README §12).
#  실차 절차의 '삼각대에 목업 신호등' 을 화면 합성으로 대신한다.
# ══════════════════════════════════════════════════════════════════════════
name: stopline_demo_detect
contract: contracts/white1_stopline.yaml

video: track_a          # ★논리 이름★ 실제 경로는 local.yaml 의 videos:
mode: lockstep          # 프레임 1개 = 처리 1회. 기계가 달라도 같은 결과
start: 1340
limit: 90
stride: 1
warmup_s: 15.0          # YOLO 를 ★둘★ 로드한다(신호등 + 정지선) — 회귀보다 길다
sync_timeout: 8.0
sim_time: false
discard_first: 5        # YOLO 첫 추론의 지연 로딩분은 통계에서 뺀다

# ★동기 신호 뒤 여유★ /tl/state 는 정지선 추론 ★전에★ 나가고, 거리(/tl/stop_line_px)는
#   30Hz 타이머로 나간다. 이 값이 짧으면 그 프레임의 거리가 ★다음 프레임 행★ 에 붙는다.
sync_settle_ms: 60

# ── 합성 자극 : 목업 신호등 ────────────────────────────────────────────
#   화면 우상단에 세워 둔 것처럼 놓고, 접근에 맞춰 조금 키운다.
#   ⚠️ 이 그림을 노드의 YOLO 가 실제로 red 로 검출해야 관문이 열린다. 안 열리면
#      sl_px 가 통째로 −1 로 남고, 그 사실이 아래 체크에 그대로 잡힌다.
overlay:
  image: assets/red_light_mock.png
  x: 880
  y: 140
  width: 240            # ★실측으로 고른 크기★ 검출률 100% (위 지그 설정 주석)

params:
  traffic_light:
    show_window: false
    # ★정지선만 격리해서 본다★ 목업을 한 번 본 뒤로는 계속 정지선 추론이 돌게 한다.
    sl_gate_red_s: 99999.0
    # ── ★합성 목업을 위한 지그 설정 — 세 시나리오가 같은 값을 쓴다★ ────
    #   목업 그림은 ★크기가 거리와 무관★ 하다(화면에 고정 크기로 붙인다). 그런데
    #   이 노드의 근접도 판정은 '빨간 박스 높이[px]' 를 거리의 대리값으로 쓰므로,
    #   그 두 문턱을 목업의 실제 크기에 맞춰 옮겨 놓아야 판정 경로가 성립한다.
    #   실측(폭 240px 목업, 두 구간 · 보정 ON/OFF 모두): 검출률 100%,
    #   conf 0.81~0.89, ★박스 높이 70~84px★.
    #     tl_red_stop_min_height 50  → 70~84 는 전부 RED (RED_FAR 로 안 빠진다)
    #     sl_override_gate_ratio 3.0 → 상한이 50×0.7×3.0=105px 로 84 보다 위다
    #   ⚠️ 아래 0.7 배가 무엇인지 알고 두는 값이다 — _near_gate() 는 ★물고 있는
    #      동안 게이트를 0.7배로 내린다★(해제 히스테리시스). 그래서 기본값 1.6 이면
    #      1단을 무는 순간 상한이 40px → 28px 로 떨어져, 정지선이 2단 문턱에 닿기
    #      전에 [신호등 코앞] 으로 2단이 된다(실측 확인). ★발견 사항이다★ — 실차
    #      에서는 이 값을 건드리지 말고 그대로 검사해야 한다(README §12).
    tl_red_stop_min_height: 50
    sl_override_gate_ratio: 3.0
    # 이 단계는 ★인지가 되는가★ 만 본다 — 브레이크는 걸리지만 차는 없다.
    # 문턱은 기본값 그대로 두고, 실측은 단계 2(카메라 보정 탭)에서 한다.

# ── 변형 : ★왜곡보정이 정지선 검출을 죽이는가★ 를 대조로 가른다 ────────
#   [2026-08-19 실측] 이 구간에서 정지선 검출률은
#       보정 ON (실차 기본값) →   0%
#       보정 OFF            →  53%
#   정지선 seg 모델은 ★어안이 남은 원본★ 으로 학습·운용된 것인데(traffic_light.
#   _detect_stop_line 주석: "이 모델은 전체 화면으로 학습·운용된 것"), 같은 날
#   들어온 camera_model.undistort 가 그 입력을 바꿔 버렸다. alpha=0 이라 유효
#   영역을 잘라 원래 크기로 늘리므로 노면의 스케일과 종횡비가 함께 달라진다.
#   ★그래서 base 는 지금 불합격이고, 그것이 이 시험의 결과다★ — 아래 두 변형을
#   나란히 돌리면 원인이 코드 한 줄(cam_undistort)로 좁혀진다.
variants:
  # 실차 기본값 (보정 ON)
  - name: base
    perturb: none
    checks:
      - {stat: "log:boot_undistort_on", min: 1,
         why: "0-3 카메라 보정 ON — 이 변형은 실차 기본값이다"}
  # 대조군 (보정 OFF) — ★정지선이 잡히는 조건★
  - name: undist_off
    perturb: none
    params: {traffic_light: {cam_undistort: false}}
    checks:
      - {stat: "log:boot_undistort_off", min: 1,
         why: "0-3 이 변형은 보정을 끈 대조군이다 — 배너에 경고가 떠야 한다"}

# ── 판정 ───────────────────────────────────────────────────────────────
checks:
  # ── 단계 0 : 노드가 제대로 떴는가 (절차서의 기동 로그 4줄) ──────────
  - {stat: "log:boot_sl_class", min: 1,
     why: "0-1 정지선 클래스표에 stop-line 이 있고 그 id 를 쓴다"}
  - {stat: "log:boot_sl_on", min: 1,
     why: "0-2 정지선 배너가 나온다(★꺼져 있다★ 가 아니다)"}
  - {stat: "log:boot_weight_fail", max: 0,
     why: "0-1 가중치를 못 읽으면 이 시험은 성립하지 않는다"}
  - {stat: "log:boot_class_missing", max: 0,
     why: "★여기서 멈춘다★ 다른 클래스를 정지선으로 읽으면 엉뚱한 곳에서 선다"}

  # ── 합성 자극이 실제로 먹었는가 ─────────────────────────────────────
  - {where: "tl_state == 'RED' or tl_state == 'RED_FAR'", stat: frac, min: 0.5,
     why: "목업 신호등이 검출돼야 정지선 관문이 열린다. 낮으면 합성 위치·크기를 조정"}

  # ── 단계 1 : ★관문★ ────────────────────────────────────────────────
  - {where: "sl_px >= 0", stat: frac, min: 0.30,
     why: "1-1 정지선이 잡히는 프레임 비율. 구 white 는 100% 미검출이었다"}
  - {where: "sl_px >= 0", stat: run_max_s, min: 0.7,
     why: "1-1 ★끊기지 않고 계속★ 잡히는가. 스치듯 잡히면 sl_hold_s(0.2s)를 못 채운다"}
  - {signal: sl_px, where: "sl_px >= 0", stat: p95_abs_diff, max: 60.0,
     why: "2-3 거리가 프레임마다 튀면 문턱을 넘나든다 = 단계가 흔들린다"}
  # 다가가는 구간이므로 거리는 줄어야 한다. 몇 번은 늘 수 있지만(마스크가 흔들린다)
  # 자주 뒤집히면 최근접점을 잘못 잡고 있는 것이다(1-2).
  - {signal: sl_px, where: "sl_px >= 0", stat: increases, max: 12,
     why: "1-2 접근 중인데 거리가 자꾸 늘면 최하단점이 정지선 차 쪽 가장자리가 아니다"}

  # ── 성능 ────────────────────────────────────────────────────────────
  - {stat: drop_rate, max: 0.02,
     why: "lockstep 인데 프레임이 새면 동기 실패"}
  - {stat: latency_p95_ms, max: 900,
     why: "4-12 추론 둘(신호등+정지선)에 왜곡보정 remap 이 얹힌다"}

  # ── 받는 쪽 ─────────────────────────────────────────────────────────
  - {stat: "contribution:stopline_gate", min: 0.30,
     why: "정지선을 보고 판단할 수 있었던 프레임 비율"}

# ── 회귀 허용오차 ──────────────────────────────────────────────────────
compare_tol:
  _default: 1.0e-6
  sl_px: 1.0            # [px] BEV 거리
  sl_y:  0.002          # 프레임 높이 비율
  tl_near: 1.0          # 박스 높이 [px]
