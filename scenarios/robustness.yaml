# 강건성/메타모픽 시나리오 — 같은 장면, 조건만 바꿔서 얼마나 무너지는지 잰다.
#   GT 가 없어도 "정확도의 필요조건"은 잴 수 있다:
#   장면이 같은데 밝기만 바뀌었다고 차선 위치가 바뀌면 그건 명백한 오류다.
name: robustness
contract: contracts/white_camera.yaml

video: track_a
mode: lockstep
start: 780
limit: 200          # 섭동 수만큼 반복하므로 짧게
stride: 2
warmup_s: 8.0
sync_timeout: 4.0
discard_first: 5

params:
  perception: {show_window: false, record_video: false, enable_undistort: true}

variants:
  - {name: base,   perturb: none}
  - {name: dark,   perturb: "gamma:1.8"}        # 그늘/야간
  - {name: bright, perturb: "gamma:0.55"}       # 역광/과노출
  - {name: blur,   perturb: "blur:9"}           # 초점흐림/모션블러
  - {name: jpeg,   perturb: "jpeg:25"}          # 압축 열화
  - {name: noise,  perturb: "noise:12"}         # 센서 노이즈(고정 시드)
  - {name: soft,   perturb: "scale:0.5"}        # 해상도 손실
  # hflip 은 메타모픽 테스트다: 장면을 좌우 반전하면
  # cte/theta 는 부호만 뒤집혀야 한다. 크기가 달라지면 IPM src_pts 비대칭이거나
  # 좌/우 차선 처리에 비대칭 버그가 있는 것이다.
  - {name: hflip,  perturb: "hflip", mirror: true}

checks:
  - {stat: drop_rate, max: 0.05}
