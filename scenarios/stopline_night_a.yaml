# ══════════════════════════════════════════════════════════════════════════
#  실차 야간 영상 A — ★정지선 「인지」 시험★ (STOPLINE_TEST.md 단계 0·1)
# ══════════════════════════════════════════════════════════════════════════
#  이 파일이 묻는 것 : "★있는 곳에서 잡고, 없는 곳에서는 안 잡는가★"
#
#  ⚠️ ★[2026-08-25] 이 파일의 전제가 뒤집혔다★
#  종전에는 "이 영상에는 정지선이 ★없다★(25프레임 균등 샘플로 확인)" 를 전제로
#  ★오검출 시험★ 이었다. 그 표본이 구간을 통째로 건너뛴 것이다 —
#  ★이 영상에는 정지선이 있다★ (프레임 307~377 · 542~621 · 673~736).
#  세그 마스크를 원본에 그려 확인했고, 검출 208프레임은 ★전부 실재하는 정지선★
#  이며 오검출은 0건이다. 즉 종전 판정은 ★정검출을 오검출로 세고 있었다★.
#  자세한 근거와 구간표는 아래 checks 의 '본론' 절에 있다.
#
#  ⚠️ 신호등은 여전히 ★한 번도 안 나온다★ — 그래서 합성 목업이 필요하다(아래 overlay).
#
#  ── 이 파일이 잴 수 있는 것과 없는 것 ──────────────────────────────────
#  ★잰다★   : 무엇을 정지선으로 보는가 (검출 위치·오검출 유무)
#  ★못 잰다★ : 정지선을 보고 1단→2단으로 서는가.
#              목업이 프레임 0부터 고정으로 붙어 RED 가 즉시 확정되고, 정지선이
#              나오기 20초 전에 이미 2단이 물리기 때문이다.
#              → ★그 성공 경로는 stopline_approach_night_a.yaml 이 잰다★
#
#  ⚠️ ★이 파일의 checks 를 stopline_field 로 되가져가지 말 것★ 여기 프레임 창은
#     ★이 영상·이 stride★ 에 묶인 값이다. 두 파일은 서로 다른 질문이다.
# ══════════════════════════════════════════════════════════════════════════
name: stopline_night_a
contract: contracts/white1_stopline.yaml

video: night_a          # ★논리 이름★ 실제 경로는 local.yaml 의 videos:
                        #   1920x1080 · 30.02fps · 1292프레임 · 43.0초
                        #   ★실차 카메라로 찍은 영상이다★ (차체·앞바퀴가 화면에 있다)

# ── 재생 ───────────────────────────────────────────────────────────────
#   ★lockstep 이다★ stopline_field 가 realtime 인 것과 다르다. 이유는 이 시나리오가
#   재는 것이 ★인지★ 이지 타이밍이 아니기 때문이다 — "무엇을 정지선으로 보는가" 는
#   프레임이 1:1 로 처리돼야 기계가 달라도 같은 답이 나오고, 기준 등록도 된다.
#   (realtime 은 1080p 두 번 추론이 30fps 를 못 따라가 프레임의 2/3 를 흘린다 —
#    오검출을 세는 시험에서 표본이 3분의 1 로 줄어든다.)
#
#   ⚠️ ★그래서 시간 판정(단계 4)은 이 파일에 없다★ 이 노드의 판단은 전부 벽시계로
#      돌고(tl_hold_s 0.4s · sl_stale_s 0.5s · sl_wait_max_s 8s), lockstep 은
#      프레임당 처리시간이 그대로 흘러 그 상수들이 뜻을 잃는다. 시간은 realtime 의
#      일이다(stopline_field).
mode: lockstep
start: 0
limit: 0                # 0 = 끝까지. 오검출은 어디서 나올지 모르므로 전 구간을 본다
stride: 1
warmup_s: 15.0          # YOLO 를 ★둘★ 로드한다(신호등 + 정지선)
discard_first: 5        # YOLO 첫 추론의 지연 로딩분은 통계에서 뺀다
sync_settle_ms: 60      # ★계약 § 3 의 경고★ 동기 토픽(/tl/state)이 정지선 추론보다
                        #   먼저 나가고 거리는 30Hz 타이머로 나간다. 짧으면 그 프레임의
                        #   거리가 ★다음 프레임 행★ 에 붙는다.

# ── 합성 자극 : 목업 신호등 ────────────────────────────────────────────
#   ★없으면 이 시험 자체가 성립하지 않는다★ 이 노드는 빨간 박스를 본 적이 있어야만
#   정지선 추론을 돌린다:
#       traffic_light.py `_sl_should_run` →
#         return self.red_seen_t > 0.0 and (now - self.red_seen_t) <= self.sl_gate_red_s
#   이 영상에는 신호등이 없으므로 게이트가 한 번도 안 열리고, /tl/stop_line_px 는
#   −1 로 고정된다 — 노드가 못 해서가 아니라 ★자극이 없어서★ 다.
#   ★종전의 화면 합성(목업)을 폐지했다 [2026-08-25]★ 이 노드는 박스 높이를 거리의
#   대리값으로 쓴다. 목업은 검출되려면 480px 폭이 필요했고 그때 박스 높이가 152~166px
#   로 나와, 시험 대상인 tl_red_stop_min_height(25) 를 목업에 맞춰 옮겨야 했다.
#   ★대신 박스 높이를 직접 준다★ (자세한 근거는 stopline_night_b.yaml 같은 절 참고).
aux_schedule:
  # {프레임: 박스높이px} 15 = 전 구간 RED_FAR — 게이트만 열고 개입은 안 한다.
  "/tl/fake_box_h": {0: 15.0}

params:
  traffic_light:
    show_window: false
    # ── ★지그를 옮기지 않는다 [2026-08-25]★ 실차 기본값(25 · 1.6) 그대로 검사한다.
    #    15px 주입은 25 미만이라 RED_FAR 로 남아 개입 없이 게이트만 연다.
    # ── ★여기는 비워 둔다★ ─────────────────────────────────────────
    #   cam_undistort 는 ★켠 채로★ 둔다(노드 기본값 true). 계약이 노드와 ★같은★
    #   usb_cam_calibration.yaml 을 읽으므로 BEV 거리가 기하적으로 뜻을 갖는다.
    #   (demo 시나리오는 그 영상에서 보정을 켜면 검출이 0% 라 껐던 것이고, 그래서
    #    그쪽의 sl_px 는 기하적으로 못 믿는 값이다 — 여기서는 그러지 않는다.)
    #
    #   bev_src_pts · bev_bumper_y_px · bev_px_to_m · sl_brake1_px · sl_brake2_px
    #   는 ★단계 2(카메라 보정 탭)에서 잰 값을 «저장» 하면 이 자리에 들어온다★.
    #   ★지금은 비워 두는 것이 맞다 [2026-08-25]★ 노드가 이미 실측값을 자기
    #   기본값으로 들고 있기 때문이다 — 범퍼행 645 · 0.0082 m/px · 470/300 ·
    #   사다리꼴 [730,650,1190,650,1720,1080,200,1080] (`tb.run params` 캐시).
    #   여기 옮겨 적으면 ★노드를 재캘리브해도 시나리오가 옛 값을 덮어씌운다★.
    #   비워 두면 노드가 자기 값으로 돌고, 그 실효값은 런의 params_actual.yaml 에
    #   남아 오버레이·프레임 탐색이 ★그 값으로★ 그린다.
    #
    #   ⚠️ ★2026-08-24 런들은 이 이전이다★ 그때 노드 기본값은 범퍼행 480 · 240/60 ·
    #      사다리꼴 [750,650,1170,650,1810,1080,260,1080] 이었다(절차서가 "근거 없는
    #      값"이라고 못 박은 그 값). 그 런의 sl_px 절대값은 믿지 말 것이고,
    #      ★그 런으로 등록한 기준이 있으면 버려야 한다★ — 지금 노드와 기하가 다르다.
    #      (오검출 여부는 보정과 무관하게 판정된다 — 잡혔느냐 아니냐이지
    #       몇 px 이냐가 아니라서다. 그래서 「없는 정지선을 잡았다」는 결론은 유효하다.)
  # ── ★[2026-08-25] perception · camera_judgment 블록을 지웠다★ ──────────
  #   이 계약(white1_stopline)이 띄우는 노드는 ★traffic_light 하나뿐★ 이라
  #   (contracts/white1_stopline.yaml 의 nodes:), 그 두 이름에 준 값은 아무 노드에도
  #   안 닿는 ★죽은 설정★ 이었다. 지운 것은 값이 아니라 «닿지 않는 글» 이다.
  #
  #   ⚠️ ★지워야 했던 이유 — 조용히 틀린 값이 제일 나쁘다★ 거기 적혀 있던 것은
  #      ipm_src_pts [750,650,1170,650,1810,1080,260,1080] 과 pixel_to_meter_bev
  #      0.006 이었다. 둘 다 ★지금은 틀린 값★ 이다(실측: 사다리꼴
  #      [730,650,1190,650,1720,1080,200,1080] · 0.0082). 아무 효과도 없으면서
  #      읽는 사람에게는 '이 시험은 저 기하로 돈다' 고 말하고 있었다.
  #
  #   ★BEV 를 그리는 값은 어디서 오는가★ 계약의 calibration.targets 가
  #   traffic_light 의 bev_src_pts · bev_bumper_y_px · sl_brake1_px · sl_brake2_px ·
  #   bev_px_to_m 를 그대로 읽는다(tb/render.py). 런의 params_actual.yaml 에 그
  #   실효값이 남으므로 ★오버레이는 노드가 실제로 쓴 기하로 그려진다★.
  #   → 차선 노드가 있는 계약을 쓰게 되면 그때 그 계약의 이름으로 다시 적을 것.

variants:
  - {name: base, perturb: none}

# ── 판정 ───────────────────────────────────────────────────────────────
checks:
  # ── 단계 0 : 노드가 제대로 떴는가 (영상과 무관하게 유효하다) ─────────
  - {stat: "log:boot_sl_class", min: 1,
     why: "0-1 정지선 클래스표에 stop-line 이 있고 그 id 를 쓴다"}
  - {stat: "log:boot_sl_on", min: 1,
     why: "0-2 정지선 배너가 나온다 (꺼져 있으면 이 시험이 통째로 무의미하다)"}
  - {stat: "log:boot_undistort_on", min: 1,
     why: "0-3 카메라 보정 ON — OFF 면 BEV 거리를 믿을 수 없다"}
  - {stat: "log:boot_weight_fail", max: 0,
     why: "0-1 .engine 은 빌드한 GPU 에 묶인다 — 이 기계에서는 .pt 를 줄 것"}
  - {stat: "log:boot_class_missing", max: 0,
     why: "★여기서 멈춘다★ 다른 클래스를 정지선으로 읽으면 엉뚱한 곳에서 선다"}

  # ── 시험이 성립하는가 : 합성 목업이 실제로 검출됐는가 ────────────────
  #   ★이것이 떨어지면 아래 오검출 판정은 읽을 가치가 없다★ 게이트가 안 열려
  #   정지선 추론이 아예 안 돈 것이라, sl_px 가 −1 인 것은 당연하기 때문이다.
  - {stat: "log:boot_inject", min: 1,
     why: "주입이 켜져 있는가(tl_fake_box_h>0). 없으면 aux_schedule 가 안 닿아
           게이트가 안 열린 것 — 오검출 표본이 0 이다"}
  - {where: "tl_red_far", stat: frac, min: 0.90,
     why: "15px 주입은 실차 문턱(25) 미만이라 ★전 구간 RED_FAR★ 여야 한다"}
  - {where: "tl_state == 'RED'", stat: frac, max: 0.02,
     why: "★RED 로 확정되면 안 된다★ 나오면 검출기가 진짜 빨간 박스를 겹쳐 본 것이다"}
  - {stat: "log:near_override", max: 0,
     why: "[신호등 코앞]. RED_FAR 주입에서는 안 나와야 한다 — 나오면 tl_max_height_frac
           이 못 막은 야간 오검출이 겹친 것이다"}

  # ── ★본론★ 있는 곳에서 잡고, 없는 곳에서는 안 잡는가 (1-3 · 1-4) ────
  #
  #   ⚠️ ★[2026-08-25 전제 정정] 이 영상에는 정지선이 있다★ 종전에 이 자리에는
  #      "정지선이 없다(25프레임 샘플로 확인)" 를 전제로 한 오검출 판정 두 개가
  #      있었다. 그 표본이 구간을 통째로 건너뛴 것이다 — 세그 마스크를 원본에
  #      그려 확인하니 검출 208프레임은 ★전부 실재하는 정지선★ 이고 오검출은
  #      0건이다. 종전 판정은 ★정검출을 오검출로 세고 있었다★.
  #
  #        구간   프레임     마스크 x(원본)   정체
  #          A    307~377    402~773        반대편 차선 정지선 (첫 교차로)
  #          B    542~621    654~1361       ★우리 차선 정지선★
  #          C    673~736    342~749        반대편 차선 정지선 (둘째 교차로)
  #
  #      노란 중앙선 기준으로 A·C 는 왼쪽, B 는 오른쪽이다. 세 창 바깥에서는
  #      ★단 한 프레임도 안 잡힌다★ — 그래서 판정을 '프레임 창' 으로 바꾼다.
  #      ⚠️ 구간을 옮기려면 세그 마스크를 다시 그려 확인할 것(눈대중 금지).
  #      ⚠️ 프레임 번호는 ★이 영상·이 stride★ 에 묶인다. video/stride 를 바꾸면
  #         이 네 판정은 통째로 무효다.
  #
  #   ⚠️ ★반대편 차선 정지선(A·C)을 노드가 그대로 문다★ 횡방향 게이트가 없어서다
  #      (sl_min_width_frac 은 폭만 보고 위치를 안 본다). 그것은 여기서 재는 것이
  #      아니라 ★노드 쪽 과제★ 다 — 이 시나리오는 '무엇을 정지선으로 보는가' 만 묻는다.
  - {where: "sl_px >= 0 and frame >= 535 and frame <= 625", stat: count, min: 50,
     why: "★우리 차선 정지선이 실재하는 구간이다★ 여기서 못 잡으면 인지가 안 되는
           것이다. 실측 80프레임 — 50 은 그 아래로 크게 내려가면 알아채라는 하한이고,
           올리려면 실측 근거를 대고 올릴 것"}
  - {where: "sl_px >= 0 and (frame < 300 or (frame > 380 and frame < 535) or (frame > 625 and frame < 665) or frame > 745)",
     stat: count, max: 5,
     why: "★정지선이 없는 구간이다★ 여기서 잡히면 횡단보도(1-4) 또는 차체(1-3)
           오검출이다. 실측 0프레임 — 5 는 단발을 봐주는 여유이지 계통적 오검출을
           봐주는 값이 아니다(느슨하게 하지 말 것)"}
  - {stat: "log:stop_at_line", max: 0,
     why: "★개입은 여기서 재지 않는다★ 15px 주입은 RED_FAR 라 _stop_plan 이 안 돈다 —
           노드는 정지선을 ★보기만 하고 서지 않는다★(인지 시험이라 그게 맞다).
           그러니 [정지선 앞] 은 전 구간 0 이어야 한다. 뜨면 검출기가 진짜 큰 빨간
           박스를 겹쳐 봐 RED 로 확정된 것 — 멈춰서 볼 일이다.
           ★2단계 정지(성공 경로)는 stopline_approach_night_a.yaml 이 잰다★"}
  # ⚠️ ★stop_no_line/stop_missed 는 판정하지 않는다 [2026-08-25]★ RED_FAR 주입에서는
  #    노드가 아무 단계도 안 물어 세 로그가 다 안 난다 — 그게 이 시험의 정상이다.
  #    검출 자체는 아래 '본론' 의 sl_px 창별 판정이 잰다(제동 혼입 없이).

  # ── 개입의 단조성 (영상과 무관하게 성립해야 하는 불변식) ─────────────
  - {signal: brake_level, stat: decreases, max: 1,
     why: "4-6 리니어는 물리적으로 왕복하는 장치이고 그 왕복이 제일 나쁜 고장
           모드다. 해제(→0)는 1회 허용"}
  - {where: "sl_wait and brake_level > 0", stat: count, max: 0,
     why: "4-2 정지선을 기다리는 동안 물렸다면 다른 발행자가 물은 것이다"}

  # ── 4-12 처리율 ─────────────────────────────────────────────────────
  #   ⚠️ lockstep 이라 이 값은 '이 기계에서 프레임 하나에 얼마 걸리나' 다.
  #      실차의 여유를 재는 것은 realtime 의 일이다(stopline_field).
  - {stat: latency_p95_ms, max: 400,
     why: "4-12 이보다 늦으면 확정 시간(0.4s)을 못 채워 신호등에서 못 선다"}

# ── 회귀 허용오차 ──────────────────────────────────────────────────────
#   lockstep 이므로 ★기준(baseline)을 등록해도 된다★ — 프레임이 1:1 로 처리돼
#   어느 프레임에 어느 값이 실리는지가 재현된다. 카메라 보정을 마친 뒤에 등록할 것
#   (보정 전 값으로 기준을 잡으면 보정하는 순간 전부 어긋난다).
#
#   ⚠️ ★[2026-08-25 정정] "값이 정확히 같다" 는 완전히 참이 아니다★ 설정을 한 글자도
#      안 바꾸고 같은 코드로 두 번 돌려 비교했더니 ★1287프레임 중 3~4개가 달랐다★
#      (실측: final2 vs fixed = 3개, fixed vs clean = 4개).
#      다른 프레임은 언제나 ★검출 구간의 경계★ 다 — 319 · 377 · 621 · 683 · 736.
#      그 자리에서 YOLO 의 conf 가 문턱에 걸쳐 있어 CUDA 부동소수 비결정성 한 톨에
#      검출이 켜졌다 꺼졌다 한다. 코드가 아니라 ★GPU 가 만드는 흔들림★ 이다.
#
#      ★그래서 회귀 비교를 이 값 그대로 믿으면 안 된다★ 경계 프레임 하나가 뒤집히면
#      sl_px 가 −1 ↔ 600 으로 튀어 아래 tol(1.0)을 600배 넘긴다. 코드를 안 고쳐도
#      ★가짜 회귀 3~4건★ 이 뜬다는 뜻이다.
#      → 기준을 등록해서 쓸 때는 ★프레임별 값이 아니라 위 checks(구간별 count)로
#        판정할 것★. 이 파일의 판정을 프레임 창 count 로 짠 이유가 여기에도 있다
#        (하한 50 은 실측 80 에서 30프레임이나 여유를 둔 값이다 — 경계 몇 개가
#         뒤집혀도 흔들리지 않는다).
compare_tol:
  _default: 1.0e-6
  sl_px: 1.0
  sl_y:  0.005
  tl_near: 1.0
