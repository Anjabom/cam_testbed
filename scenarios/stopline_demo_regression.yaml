# ══════════════════════════════════════════════════════════════════════════
#  ⚠️ ★이것은 track_record.mp4 전용 「지그」다★ — 실차 판정용이 아니다
# ══════════════════════════════════════════════════════════════════════════
#  이 파일의 프레임 구간·목업 크기·두 문턱·근접도 문턱은 전부 ★그 영상 하나에서
#  뽑은 값★ 이다. 그 영상은 실차와 카메라 위치·화각이 다르므로, 여기서 나온 숫자로
#  white1 을 튜닝하면 안 된다(2026-08-19 지시).
#
#  ★그럼 왜 남겨 두는가★ 둘이다:
#    ① 테스트베드 자신의 회귀 — 판정 엔진·계약·화면이 성한지 매번 확인한다
#    ② README §12 의 발견 사항 4개를 ★다시 돌려 볼 수 있는 유일한 절차★ 다
#
#  ★실차 카메라로 찍은 새 영상은 scenarios/stopline_field.yaml 로 돌린다★
#  (그쪽은 합성 목업도, 이 영상용 지그 값도 쓰지 않는다)
# ══════════════════════════════════════════════════════════════════════════
# ══════════════════════════════════════════════════════════════════════════
#  단계 5 — ★회귀★ 정지선이 없으면 종전과 완전히 같은가
# ══════════════════════════════════════════════════════════════════════════
#  이 기능의 설계 전제는 한 줄이다: "정지선이 없으면 종전과 완전히 같다."
#  절차서 단계 5 는 그것을 확인하는 자리이고, 여기서는 ★정지선이 없는 구간★ 에
#  목업 신호등만 세워 놓고 네 조건을 나란히 돌려 비교한다.
#
#  ★고른 구간의 근거★ 1420~1479 프레임에는 정지선이 없다 — 바로 앞 구간(1354~1402)
#  에서 정지선을 지나친 ★직후★ 다. stopline_demo_approach 와 같은 노면·같은 조명이라
#  '정지선만 없는' 대조가 된다. 정말 없는지는 아래 5-1 체크가 매번 확인한다.
#
#  ★네 변형이 곧 절차서의 네 항목이다★
#    base       5-1  정지선 없는 접근 → [정지선 없음] 으로 2단 직행
#    sl_off     5-2  기능 자체를 끄면 base 와 같아야 한다
#    undist_on  5-7  왜곡보정을 켜면 배너에 경고가 뜨고, 그래도 노드는 돈다
#    red_gone   5-3  빨간불이 사라지면 red_release_hold_s 뒤에 놓는다
# ══════════════════════════════════════════════════════════════════════════
name: stopline_demo_regression
contract: contracts/white1_stopline.yaml

video: track_a
mode: realtime
rate: 0.25              # stopline_demo_approach 와 같은 속도 — 시간 판정을 실차에 맞춘다
start: 1420
limit: 60               # 1420~1479 — 정지선을 지나친 직후
stride: 1
warmup_s: 8.0
prime: 3
discard_first: 3

overlay:
  image: assets/red_light_mock.png
  x: 880
  y: 140
  width: 240            # ★실측으로 고른 크기★ 검출률 100% (아래 지그 설정 주석)
  from: 0.15            # 처음 몇 프레임은 신호등 없이 — 개입 없는 구간을 확보한다

params:
  traffic_light:
    show_window: false
    # 보정을 끄고 돈다 — 켜면 정지선이 ★어디서도★ 안 잡혀(stopline_demo_detect 참고)
    # "정지선이 없는 구간" 이라는 전제 자체를 확인할 수 없다.
    cam_undistort: false
    # ── ★합성 목업을 위한 지그 설정 — 세 시나리오가 같은 값을 쓴다★ ────
    #   목업 그림은 ★크기가 거리와 무관★ 하다(화면에 고정 크기로 붙인다). 그런데
    #   이 노드의 근접도 판정은 '빨간 박스 높이[px]' 를 거리의 대리값으로 쓰므로,
    #   그 두 문턱을 목업의 실제 크기에 맞춰 옮겨 놓아야 판정 경로가 성립한다.
    #   실측(폭 240px 목업, 두 구간 · 보정 ON/OFF 모두): 검출률 100%,
    #   conf 0.81~0.89, ★박스 높이 70~84px★.
    #     tl_red_stop_min_height 50  → 70~84 는 전부 RED (RED_FAR 로 안 빠진다)
    #     sl_override_gate_ratio 3.0 → 상한이 50×0.7×3.0=105px 로 84 보다 위다
    #   ⚠️ 아래 0.7 배가 무엇인지 알고 두는 값이다 — _near_gate() 는 ★물고 있는
    #      동안 게이트를 0.7배로 내린다★(해제 히스테리시스). 그래서 기본값 1.6 이면
    #      1단을 무는 순간 상한이 40px → 28px 로 떨어져, 정지선이 2단 문턱에 닿기
    #      전에 [신호등 코앞] 으로 2단이 된다(실측 확인). ★발견 사항이다★ — 실차
    #      에서는 이 값을 건드리지 말고 그대로 검사해야 한다(README §12).
    tl_red_stop_min_height: 50
    sl_override_gate_ratio: 3.0

variants:
  # ── 5-1 정지선이 없는 곳에서 종전 동작 ─────────────────────────────
  - name: base
    perturb: none
    checks:
      - {stat: "log:stop_no_line", min: 1,
         why: "5-1 정지 사유가 [정지선 없음] 이어야 한다 = 종전 동작"}
      - {event: "brake_level:0->2", stat: count, min: 1,
         why: "5-1 ★2단 직행★ — 1단을 거치지 않는다(정지선이 없으니 예비제동도 없다)"}
      - {event: "brake_level:0->1", stat: count, max: 0,
         why: "5-1 정지선이 없는데 1단이 걸리면 오검출이다"}

  # ── 5-2 기능 자체를 끄면 base 와 같아야 한다 ────────────────────────
  - name: sl_off
    perturb: none
    params: {traffic_light: {sl_enable: false}}
    checks:
      - {stat: "log:boot_sl_off", min: 1,
         why: "5-2 배너에 ★꺼져 있다★ 가 떠야 한다"}
      - {event: "brake_level:0->2", stat: count, min: 1,
         why: "5-2 종전 동작 그대로 2단 직행"}
      - {stat: "log:stop_no_line", min: 1,
         why: "5-2 사유도 [정지선 없음] 이다"}

  # ── 5-7 왜곡보정을 켠다 ────────────────────────────────────────────
  - name: undist_on
    perturb: none
    params: {traffic_light: {cam_undistort: true}}
    checks:
      - {stat: "log:boot_undistort_on", min: 1,
         why: "5-7 보정을 켜면 배너가 ON 이어야 한다"}
      - {event: "brake_level:0->2", stat: count, min: 1,
         why: "5-7 보정 여부와 무관하게 신호등 정지는 성립한다"}

  # ── 5-3 빨간불이 사라지면 놓는다 ───────────────────────────────────
  #   목업을 재생 55% 지점에서 치운다(overlay 의 to). 그 뒤 red_release_hold_s(0.5초)
  #   가 지나면 해제되어야 한다. 프레임으로는 ★1420 + 60×0.55 = 1453★ 부근이고
  #   0.5초 = 7.5fps × 0.5 ≈ 4프레임 → 1457 안팎에서 0단이 나와야 한다.
  - name: red_gone
    perturb: none
    overlay: {to: 0.55}
    checks:
      - {event: "brake_level:2->0", stat: count, min: 1,
         why: "5-3 빨간불이 사라지면 놓아야 한다"}
      - {event: "brake_level:2->0", stat: frame, min: 1453, max: 1466,
         why: "5-3 해제 시점. 목업이 사라진 프레임(≈1453)에서 0.5~1.5초 안이다.
               훨씬 뒤면 영상이 끝난 뒤의 fail-open 으로 놓인 것이다"}
      - {stat: "log:release_red_gone", min: 1,
         why: "5-3 해제 사유가 '빨간불 미감지' 여야 한다"}

# ── 모든 변형에 공통 ───────────────────────────────────────────────────
checks:
  - {stat: "log:boot_weight_fail", max: 0,
     why: "가중치를 못 읽으면 아무 판정도 성립하지 않는다"}
  # 5-1 이 구간에 정지선이 정말 없는가 (전제 확인)
  - {where: "sl_px >= 0", stat: frac, max: 0.10,
     why: "5-1 이 구간은 정지선이 없는 곳이어야 한다. 높으면 구간을 잘못 골랐거나
           ★오검출★ 이다 — 후자면 그것이 이 시험의 결과다"}
  - {stat: "log:wait_cap", max: 0,
     why: "정지선이 없으니 대기 상한이 발동할 일도 없다"}
  - {signal: brake_level, stat: increases, min: 1,
     why: "빨간불을 보고 한 번은 물어야 한다(안 물면 신호등에서 안 서는 것이다)"}

  # ── ★발견된 결함 — 5-6 카메라 두절★ ─────────────────────────────────
  #   재생이 끝나면 프레임이 끊긴다. 그때 이 노드는 내부 상태를 ★틱 주기(30Hz)로
  #   왕복★ 시킨다: 프레임이 red_release_hold_s(0.5초)보다 오래 끊기면 _red_gone 이
  #   참이 되는데, tl_state 는 아직 'RED' 이고 판정 유효기간(tl_state_max_age 3초)이
  #   남아 있어 _red_confirmed 도 참이다. tick 은 '해제 → 재계획' 순서라 매 틱
  #   0단 → 2단을 되풀이하고, 그때마다 _reset_stop_line_wait() 이 대기 근거를 지운다.
  #   ⚠️ traffic_light.py tick 의 주석은 "동시에 참이 될 수 없다"고 적고 있다 —
  #      실측은 그 반대다(해제 76회 / 재체결 75회, 2.5초 동안).
  #   ★/brake_level 은 변화분만 발행되므로 리니어 자체는 왕복하지 않는다★ 그래서
  #   물리적 피해는 없지만, 로그가 30Hz 로 쏟아지고 대기 상태가 계속 초기화된다.
  #   0.5~3초짜리 카메라 끊김은 실차에서 충분히 있을 수 있다(USB·추론 지연).
  - {stat: "log:release_red_gone", max: 3,
     why: "5-6 해제 판정은 접근 1회에 한 번이면 된다. 수십 번이면 위 왕복이다"}

compare_tol:
  _default: 1.0e-6
  sl_px: 4.0
  sl_y: 0.01
  tl_near: 3.0

# ── ⚠️ ★기준(baseline)을 등록하지 않는다★ ─────────────────────────────
#   realtime 은 유실 패턴이 기계·부하마다 달라서 ★어느 프레임에 어느 값이 실리는지★
#   가 재현되지 않는다(실측: 87프레임 중 1프레임이 어긋나 max|Δsl_px| 84px).
#   프레임별 회귀 비교는 lockstep 의 일이고, 이 시나리오는 ★판정(checks)★ 으로 본다 —
#   판정은 값의 위치가 아니라 '무엇이 언제 일어났나' 를 재므로 흔들리지 않는다.
#   (회귀 비교가 필요하면 stopline_demo_detect 가 lockstep 으로 맡는다.)
