# ══════════════════════════════════════════════════════════════════════════
#  실차 야간 영상 B — ★정지선 「오검출」 시험★ (STOPLINE_TEST.md 단계 0·1)
# ══════════════════════════════════════════════════════════════════════════
#  ★이 시나리오가 묻는 것은 stopline_field 와 반대다★
#
#    stopline_field  : "정지선이 있는데 잡는가"         (검출 시험)
#    이 파일          : "정지선이 없는데 잡았다고 하는가" (오검출 시험)
#
#  ★night_a 와 같은 파일이다★ 영상만 다르다 — 같은 밤, 같은 차, 같은 카메라로
#  이어서 찍은 두 번째 클립이다. 둘 다 돌리는 이유는 오검출이 ★어느 장면에서★
#  나는지를 보려는 것이다(횡단보도 모양·조명·노면이 구간마다 다르다).
#
#  ── 왜 반대인가 ────────────────────────────────────────────────────────
#  이 영상(night_b)에는 ★정지선이 없다★. 25프레임 균등 샘플로 전 구간을 훑어
#  확인했다 — 야간 캠퍼스 도로이고 ★횡단보도만★ 여러 번 나온다. 그리고
#  ★신호등도 한 번도 안 나온다★.
#
#  그래서 stopline_field 의 단계 1 판정(`sl_px >= 0` 이 30% 이상)을 그대로 쓰면
#  ★통과하는 것이 곧 실패★ 가 된다 — 없는 정지선을 잡았다는 뜻이기 때문이다.
#  절차서가 1-3(차체 오검출)·1-4(횡단보도 오검출)로 경계한 바로 그 상황이다.
#  판정을 뒤집은 것이지 ★느슨하게 한 것이 아니다★.
#
#  ⚠️ ★이 파일의 checks 를 stopline_field 로 되가져가지 말 것★ 그쪽은 정지선이
#     실제로 찍힌 영상용이고, 그때는 검출률 하한이 옳다. 두 파일은 서로 다른
#     질문이다.
#
#  ── 정지선이 있는 영상을 찍으면 ──────────────────────────────────────
#  «테스트 준비» 에서 `stopline_field.yaml` 을 본떠 새로 만든다. 이 파일이
#  아니다.
# ══════════════════════════════════════════════════════════════════════════
name: stopline_night_b
contract: contracts/white1_stopline.yaml

video: night_b          # ★논리 이름★ 실제 경로는 local.yaml 의 videos:
                        #   1920x1080 · 30.05fps ·  930프레임 · 31.0초
                        #   ★실차 카메라로 찍은 영상이다★ (차체·앞바퀴가 화면에 있다)

# ── 재생 ───────────────────────────────────────────────────────────────
#   ★lockstep 이다★ stopline_field 가 realtime 인 것과 다르다. 이유는 이 시나리오가
#   재는 것이 ★인지★ 이지 타이밍이 아니기 때문이다 — "무엇을 정지선으로 보는가" 는
#   프레임이 1:1 로 처리돼야 기계가 달라도 같은 답이 나오고, 기준 등록도 된다.
#   (realtime 은 1080p 두 번 추론이 30fps 를 못 따라가 프레임의 2/3 를 흘린다 —
#    오검출을 세는 시험에서 표본이 3분의 1 로 줄어든다.)
#
#   ⚠️ ★그래서 시간 판정(단계 4)은 이 파일에 없다★ 이 노드의 판단은 전부 벽시계로
#      돌고(tl_hold_s 0.4s · sl_stale_s 0.5s · sl_wait_max_s 8s), lockstep 은
#      프레임당 처리시간이 그대로 흘러 그 상수들이 뜻을 잃는다. 시간은 realtime 의
#      일이다(stopline_field).
mode: lockstep
start: 0
limit: 0                # 0 = 끝까지. 오검출은 어디서 나올지 모르므로 전 구간을 본다
stride: 1
warmup_s: 15.0          # YOLO 를 ★둘★ 로드한다(신호등 + 정지선)
discard_first: 5        # YOLO 첫 추론의 지연 로딩분은 통계에서 뺀다
sync_settle_ms: 60      # ★계약 § 3 의 경고★ 동기 토픽(/tl/state)이 정지선 추론보다
                        #   먼저 나가고 거리는 30Hz 타이머로 나간다. 짧으면 그 프레임의
                        #   거리가 ★다음 프레임 행★ 에 붙는다.

# ── 신호등 주입 : 게이트를 여는 빨간불 ─────────────────────────────────
#   ★없으면 이 시험 자체가 성립하지 않는다★ 이 노드는 빨간 박스를 본 적이 있어야만
#   정지선 추론을 돌린다(traffic_light.py `_sl_should_run`). 이 영상에는 신호등이
#   없으므로 게이트가 한 번도 안 열리고 /tl/stop_line_px 는 −1 로 고정된다 —
#   노드가 못 해서가 아니라 ★자극이 없어서★ 다.
#
#   ★종전의 화면 합성(목업)을 폐지했다 [2026-08-25]★ 이 노드는 ★박스 높이를 거리의
#   대리값★ 으로 쓴다. 그런데 목업은 화면에 고정 크기로 붙어 크기가 거리와 무관하고,
#   게다가 검출되려면 480px 폭이 필요했는데 그때 박스 높이가 152~166px 로 나와서
#   ★시험 대상인 tl_red_stop_min_height(25) 를 목업에 맞춰 옮겨야★ 했다. 시험 대상
#   상수를 옮기면 그 시험은 그 상수를 검증하지 않는다. 게다가 그 목업조차 실제로는
#   검출되지 않고 ROI 전체짜리 쓰레기 박스(conf 0.81)가 잡혀 [코앞] 2단 직행이었다.
#
#   ★대신 박스 높이를 직접 준다★ 계약의 /tl/fake_box_h 에 aux_schedule 로. 15px 는
#   RED_FAR — 게이트만 열리고(정지선 추론은 돈다) 근접 게이트는 안 넘어(제동 안 걸림)
#   ★오검출을 세기에 딱 좋은 상태★ 다. 실차 문턱·게이트를 ★그대로★ 두고 검사한다.
aux_schedule:
  # ★뷰어(--watch)에서 저작됨 2026-08-26 14:25★ 판정 런이 이 프레임을 재생한다
  "/tl/fake_box_h": {331: 15.0, 385: 40.0, 443: 0.0, 632: 15.0, 692: 40.0, 756: 0.0}

params:
  traffic_light:
    show_window: false
    # ── ★지그를 옮기지 않는다 [2026-08-25]★ ─────────────────────────
    #   종전에는 목업 크기에 맞추느라 tl_red_stop_min_height 50 · sl_override_gate_ratio
    #   3.0 을 여기서 덮었다. 주입 방식은 박스 높이를 직접 주므로 그럴 필요가 없다 —
    #   ★실차 기본값(25 · 1.6) 그대로 검사한다★. 15px 주입은 25 미만이라 RED_FAR 로
    #   남고(근접 게이트 안 넘음), 그래서 개입 없이 게이트만 열린다.
    # ── ★여기는 비워 둔다★ ─────────────────────────────────────────
    #   cam_undistort 는 ★켠 채로★ 둔다(노드 기본값 true). 계약이 노드와 ★같은★
    #   usb_cam_calibration.yaml 을 읽으므로 BEV 거리가 기하적으로 뜻을 갖는다.
    #   (demo 시나리오는 그 영상에서 보정을 켜면 검출이 0% 라 껐던 것이고, 그래서
    #    그쪽의 sl_px 는 기하적으로 못 믿는 값이다 — 여기서는 그러지 않는다.)
    #
    #   bev_src_pts · bev_bumper_y_px · bev_px_to_m · sl_brake1_px · sl_brake2_px
    #   는 ★단계 2(카메라 보정 탭)에서 잰 값을 «저장» 하면 이 자리에 들어온다★.
    #   ★지금은 비워 두는 것이 맞다 [2026-08-25]★ 노드가 이미 실측값을 자기
    #   기본값으로 들고 있기 때문이다 — 범퍼행 645 · 0.0082 m/px · 470/300 ·
    #   사다리꼴 [730,650,1190,650,1720,1080,200,1080] (`tb.run params` 캐시).
    #   여기 옮겨 적으면 ★노드를 재캘리브해도 시나리오가 옛 값을 덮어씌운다★.
    #   비워 두면 노드가 자기 값으로 돌고, 그 실효값은 런의 params_actual.yaml 에
    #   남아 오버레이·프레임 탐색이 ★그 값으로★ 그린다.
    #
    #   ⚠️ ★2026-08-24 런들은 이 이전이다★ 그때 노드 기본값은 범퍼행 480 · 240/60 ·
    #      사다리꼴 [750,650,1170,650,1810,1080,260,1080] 이었다(절차서가 "근거 없는
    #      값"이라고 못 박은 그 값). 그 런의 sl_px 절대값은 믿지 말 것이고,
    #      ★그 런으로 등록한 기준이 있으면 버려야 한다★ — 지금 노드와 기하가 다르다.
    #      (오검출 여부는 보정과 무관하게 판정된다 — 잡혔느냐 아니냐이지
    #       몇 px 이냐가 아니라서다. 그래서 「없는 정지선을 잡았다」는 결론은 유효하다.)
  perception:
    ipm_src_pts: [750.0, 650.0, 1170.0, 650.0, 1810.0, 1080.0, 260.0, 1080.0]
    lane_roi_xmin: 0
    lane_roi_ymin: 600
    lane_roi_xmax: 1920
    lane_roi_ymax: 1080
    tl_roi_xmin: 0
    tl_roi_ymin: 0
    tl_roi_xmax: 1920
    tl_roi_ymax: 600
    pixel_to_meter_bev: 0.006
    lane_width_m: 3.0
  camera_judgment:
    pixel_to_meter_bev: 0.006
    lane_width_m: 3.0

variants:
  - {name: base, perturb: none}

# ── 판정 ───────────────────────────────────────────────────────────────
checks:
  # ── 단계 0 : 노드가 제대로 떴는가 (영상과 무관하게 유효하다) ─────────
  - {stat: "log:boot_sl_class", min: 1,
     why: "0-1 정지선 클래스표에 stop-line 이 있고 그 id 를 쓴다"}
  - {stat: "log:boot_sl_on", min: 1,
     why: "0-2 정지선 배너가 나온다 (꺼져 있으면 이 시험이 통째로 무의미하다)"}
  - {stat: "log:boot_undistort_on", min: 1,
     why: "0-3 카메라 보정 ON — OFF 면 BEV 거리를 믿을 수 없다"}
  - {stat: "log:boot_weight_fail", max: 0,
     why: "0-1 .engine 은 빌드한 GPU 에 묶인다 — 안 열리면 이 기계에서 다시 빌드할 것"}
  - {stat: "log:boot_class_missing", max: 0,
     why: "★여기서 멈춘다★ 다른 클래스를 정지선으로 읽으면 엉뚱한 곳에서 선다"}

  # ── 시험이 성립하는가 : 주입이 게이트를 열었는가 ─────────────────────
  #   ★이것이 떨어지면 아래 오검출 판정은 읽을 가치가 없다★ 게이트가 안 열려
  #   정지선 추론이 아예 안 돈 것이라, sl_px 가 −1 인 것은 당연하기 때문이다.
  - {stat: "log:boot_inject", min: 1,
     why: "주입이 켜져 있는가(tl_fake_box_h>0). 이 로그가 없으면 aux_schedule 가
           노드에 안 닿은 것 — 게이트가 안 열렸으니 오검출 표본이 0 이다"}
  - {where: "tl_red_far", stat: frac, min: 0.90,
     why: "15px 주입은 실차 문턱(25) 미만이라 ★전 구간 RED_FAR★ 여야 한다.
           RED 로 새면 근접 2단이 걸려 '없는 정지선 앞 정지' 와 구별이 흐려진다"}
  - {where: "tl_state == 'RED'", stat: frac, max: 0.02,
     why: "★RED 로 확정되면 안 된다★ 15px 는 RED_FAR 이지 RED 가 아니다. RED 가
           나오면 주입값이 잘못됐거나(≥25) 검출기가 진짜 빨간 박스를 겹쳐 본 것이다"}
  - {stat: "log:near_override", max: 0,
     why: "[신호등 코앞] = 근접 게이트 초과. RED_FAR 주입에서는 절대 안 나와야 한다.
           나오면 tl_max_height_frac 이 못 막은 야간 오검출이 겹친 것이다"}

  # ── ★본론★ 정지선이 없는데 잡았다고 하는가 (1-3 · 1-4) ──────────────
  - {where: "sl_px >= 0", stat: frac, max: 0.05,
     why: "이 영상에는 정지선이 없다(전 구간 25프레임 샘플로 확인) — 잡혔다면
           횡단보도(1-4) 또는 차체(1-3) 오검출이다.
           ⚠️ 0.05 는 실측값이 아니라 ★단발과 계통을 가르는 첫 기준★ 이다:
              그 아래면 산발적 오검출, 넘으면 무언가를 꾸준히 정지선으로 보고 있다.
              첫 런의 실측이 나오면 그 근거로 조인다(느슨하게 하지 말 것)."}
  - {where: "sl_px >= 0", stat: run_max_frames, max: 3,
     why: "★계통적 오검출의 지문★ 연속으로 잡힌다면 그것은 잡음이 아니라 화면의
           무언가(횡단보도 줄무늬가 제일 유력하다)를 계속 보고 있다는 뜻이다.
           3프레임은 sl_hold_s(0.2초 ≈ 노드 실효 7fps 에서 1~2프레임)를 넘겨
           ★확정까지 가는가★ 를 가르는 선이다"}
  - {stat: "log:stop_at_line", max: 0,
     why: "★없는 정지선 앞에 섰다★ = 최악의 오검출. [정지선 앞] 은 성공 경로의
           로그인데, 정지선이 없는 이 영상에서 나오면 뜻이 정반대가 된다"}
  # ⚠️ ★stop_no_line/stop_missed 는 이제 판정하지 않는다 [2026-08-25]★ 15px 주입은
  #    RED_FAR 라 _stop_plan(정지 계획)이 아예 안 돈다 — 노드가 ★개입을 안 하는 것★ 이
  #    이 시험의 정상이다(게이트만 열고 오검출만 센다, 제동 혼입 없음). 종전 목업은
  #    RED 를 강제해 [정지선 없음]→즉시 2단이 나왔고 그것을 정답으로 삼았지만,
  #    그 동작 자체가 목업의 부작용이었다. 이제 brake 는 전 구간 0 이어야 하고,
  #    그것은 아래 brake_level.decreases 와 위 near_override 로 이미 지켜진다.

  # ── 개입의 단조성 (영상과 무관하게 성립해야 하는 불변식) ─────────────
  - {signal: brake_level, stat: decreases, max: 1,
     why: "4-6 리니어는 물리적으로 왕복하는 장치이고 그 왕복이 제일 나쁜 고장
           모드다. 해제(→0)는 1회 허용"}
  - {where: "sl_wait and brake_level > 0", stat: count, max: 0,
     why: "4-2 정지선을 기다리는 동안 물렸다면 다른 발행자가 물은 것이다"}

  # ── 4-12 처리율 ─────────────────────────────────────────────────────
  #   ⚠️ lockstep 이라 이 값은 '이 기계에서 프레임 하나에 얼마 걸리나' 다.
  #      실차의 여유를 재는 것은 realtime 의 일이다(stopline_field).
  - {stat: latency_p95_ms, max: 400,
     why: "4-12 이보다 늦으면 확정 시간(0.4s)을 못 채워 신호등에서 못 선다"}

# ── 회귀 허용오차 ──────────────────────────────────────────────────────
#   lockstep 이므로 ★기준(baseline)을 등록해도 된다★ — 프레임이 1:1 로 처리돼
#   어느 프레임에 어느 값이 실리는지가 재현된다. 카메라 보정을 마친 뒤에 등록할 것
#   (보정 전 값으로 기준을 잡으면 보정하는 순간 전부 어긋난다).
compare_tol:
  _default: 1.0e-6
  sl_px: 1.0
  sl_y:  0.005
  tl_near: 1.0
