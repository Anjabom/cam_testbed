# lane_vote 차선 알고리즘 시험 — ★실차 타이밍★ 판 (영상 night_a)
#   vote_night_a.yaml 의 realtime 짝이다. 영상·계약·판정 기준을 그대로 물려받고
#   ★재생 모드만★ 바꿨다 — 그래야 "lockstep 에서 좋던 것이 30fps 실차에서도
#   좋은가"라는 질문 하나만 남는다.
#
#   ★왜 따로 도는가★ lockstep 은 한 프레임 밀고 응답을 기다리므로 노드가 느려도
#   모든 프레임을 정확히 한 번씩 본다. 실차 카메라는 기다려 주지 않는다 —
#   30fps 로 계속 밀고, 노드가 못 따라오면 그 프레임은 그냥 없어진다.
#   lane_vote 는 이전 프레임의 해를 씨앗으로 쓰는 국소 탐색(15프레임마다 전역
#   재탐색)이라, ★프레임이 새면 씨앗과 현재 장면의 간격이 벌어진다★.
#   그 간격이 추정 품질을 얼마나 깎는지는 realtime 으로만 잴 수 있다.
#
#   ⚠️ ★기준(baseline)을 등록하지 않는다★ (README §13.7) — 유실 패턴이 기계·부하마다
#      달라 어느 프레임에 어느 값이 실리는지가 재현되지 않는다. 프레임별 회귀는
#      lockstep(vote_night_a)의 일이고, 이 파일은 ★판정(checks)★ 으로만 본다.
#      그래서 compare_tol: 도 두지 않았다.
name: vote_realtime_night_a
contract: contracts/white_vote.yaml

video: night_a           # 1920x1080 · 30.02fps · 1292프레임 · 43.0초

mode: realtime
rate: 1.0                # 실차 속도 그대로. 30fps 를 못 따라가는지 자체가 측정 대상이다
start: 0
limit: 0
stride: 1
warmup_s: 8.0
sync_timeout: 4.0
prime: 3                 # ★첫 추론(YOLO 지연 로딩)을 측정 구간 밖에서★ — realtime 필수
discard_first: 5

params:
  perception: {show_window: false, record_video: false, enable_undistort: true}
  camera_judgment: {}

variants:
  - {name: base, perturb: none}

# ── 불변식 : vote_night_a 와 ★같은 기준★ ────────────────────────────
#   인지 품질 기준은 한 줄도 낮추지 않았다. 모드가 달라졌다고 기준을 낮추면
#   "실차 타이밍에서도 되는가"를 묻지 못한다.
checks:
  # ★이 한 줄만 뜻이 다르다★ lockstep 에서 drop_rate 는 동기 실패였지만,
  #   realtime 에서는 ★30fps 입력 대비 처리율★ 이다(유실은 정상 동작).
  #   realtime.yaml 의 선례와 같은 문턱 — 0.90 이면 3fps, 그 아래면 인지가
  #   아니라 파이프라인이 죽은 것이다.
  - {stat: drop_rate,        max: 0.90, why: "30fps 입력 대비 처리율 — 유실은 정상, 전멸이 비정상"}
  - {stat: latency_p95_ms,   max: 600,  why: "프레임당 처리 지연"}
  - {signal: conf_raw,  stat: frac_nonzero, min: 0.5,
     why: "절반 이상 프레임에서 차선을 봐야 한다"}
  - {signal: lane_width_m, stat: mean, min: 2.0, max: 4.5, when_valid: true,
     why: "차선폭은 물리량이다 — 평균이 이 밖이면 px2m/IPM 캘리브가 틀렸다"}
  - {signal: lane_width_m, stat: std,  max: 0.6, when_valid: true,
     why: "같은 도로에서 폭이 흔들리면 추정이 흔들린 것"}
  # ★프레임 간 차이 두 줄은 realtime 에서 더 어려운 시험이다★ — 유실로 이웃
  #   프레임 사이의 실제 시간이 벌어지므로 같은 문턱이 더 빡빡하게 걸린다.
  #   그래도 낮추지 않는다: 실차가 겪는 것이 바로 이 간격이다.
  - {signal: theta_deg, stat: p95_abs_diff, max: 8.0,
     why: "θ 가 프레임 간 8도씩 튀면 IMU 보정에 못 쓴다"}
  - {signal: cte_rear_m, stat: p95_abs_diff, max: 0.35,
     why: "camera_judgment 의 jump_max_m 과 같은 뜻"}
  - {stat: "contribution:gps_imu_heading", min: 0.30,
     why: "GPS/IMU 헤딩 보정에 실제로 반영되는 프레임 비율"}
  - {stat: "contribution:judgment_gate", min: 0.50,
     why: "camera_judgment 치명 게이트를 통과하는 비율"}
  - {stat: "theta:abs_bias_deg", max: 1.0,
     why: "직진에서 편향이 있으면 헤딩이 계속 한쪽으로 끌린다"}
  - {stat: "theta:vibration_frac", max: 0.15,
     why: "조향 진동 대역 파워. 크면 카메라가 진동을 만든다"}
  - {stat: "flag_rate:WIDTH_BAD", max: 0.30}
  - {stat: "flag_rate:CTE_JUMP",  max: 0.10}
  # ── lane_vote 고유 ──
  - {signal: solve_ms, stat: p95, max: 25.0,
     why: "전역 재탐색(15프레임마다 1회)을 포함한 p95. 스펙 §10.1 의 전역 예산"}
