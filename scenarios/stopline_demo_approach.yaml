# ══════════════════════════════════════════════════════════════════════════
#  ⚠️ ★이것은 track_record.mp4 전용 「지그」다★ — 실차 판정용이 아니다
# ══════════════════════════════════════════════════════════════════════════
#  이 파일의 프레임 구간·목업 크기·두 문턱·근접도 문턱은 전부 ★그 영상 하나에서
#  뽑은 값★ 이다. 그 영상은 실차와 카메라 위치·화각이 다르므로, 여기서 나온 숫자로
#  white1 을 튜닝하면 안 된다(2026-08-19 지시).
#
#  ★그럼 왜 남겨 두는가★ 둘이다:
#    ① 테스트베드 자신의 회귀 — 판정 엔진·계약·화면이 성한지 매번 확인한다
#    ② README §12 의 발견 사항 4개를 ★다시 돌려 볼 수 있는 유일한 절차★ 다
#
#  ★실차 카메라로 찍은 새 영상은 scenarios/stopline_field.yaml 로 돌린다★
#  (그쪽은 합성 목업도, 이 영상용 지그 값도 쓰지 않는다)
# ══════════════════════════════════════════════════════════════════════════
# ══════════════════════════════════════════════════════════════════════════
#  단계 3·4 — ★판정표 재현★ (0단 대기 → 1단 예비제동 → 2단 확정 정지)
# ══════════════════════════════════════════════════════════════════════════
#  절차서의 단계 3 은 사람이 신호등 목업과 정지선 판때기를 들고 모든 경로를 밟는
#  것이고, 단계 4 는 실차로 저속 접근해 `sl_check.py` 로 판정하는 것이다.
#  ★이 시나리오가 그 둘을 하나로 대신한다★ — 정지선이 실제로 다가오는 영상 구간에
#  목업 신호등을 합성해 넣고, sl_check.py 와 ★같은 번호의 판정★ 을 계산한다.
#  게다가 sl_check.py 가 "눈으로 볼 것"으로 남긴 4-7(정지 사유)까지 로그로 판정한다.
#
#  ★왜 realtime 인가★ 이 노드의 판단은 전부 ★벽시계 시간★ 으로 돈다(tl_hold_s 0.4s,
#  sl_hold_s 0.2s, sl_stale_s 0.5s, sl_wait_max_s 8s — 모두 time.time() 기준이고
#  use_sim_time 을 보지 않는다). lockstep 은 프레임당 100ms 씩 걸려 30fps 영상이
#  10fps 로 흐르므로, 그 상수들이 프레임 기준으로 ★3배 빨라진다★ = 판정표의 시간이
#  재현되지 않는다. 실차 타이밍을 재려면 영상을 실제 속도로 밀어야 한다.
#  (재현성이 필요한 인지 판정은 lockstep 인 stopline_demo_detect 가 맡는다.)
#
#  ⚠️ ★보정을 끄고 돈다★ stopline_demo_detect 가 밝힌 대로, 왜곡보정을 켜면 이 영상에서
#     정지선 검출이 0% 라 판정 경로를 한 번도 밟지 못한다. 이 시나리오의 목적은
#     ★상태기계★ 를 검사하는 것이므로 인지가 되는 조건에서 돌린다.
#     그래서 여기의 sl_px 값은 ★기하적으로는 못 믿는 값★ 이다(보정 없이 BEV 를
#     걸었다). 두 문턱도 그런 뜻에서 ★이 영상용 지그★ 이고 실측값이 아니다.
# ══════════════════════════════════════════════════════════════════════════
name: stopline_demo_approach
contract: contracts/white1_stopline.yaml

video: track_a
mode: realtime          # ★실차 타이밍 재현★ (위 주석)

# ── ★배속 0.25 — 이 시나리오의 핵심 설정이다★ ──────────────────────────
#   이유가 둘이다.
#   ① ★이 클립의 접근이 너무 빠르다★ 정지선이 93px → 0px 까지 45프레임(1.5초)에
#      지나간다. 실차 2펄스(1.77m/s) 접근은 그보다 훨씬 느리고, 절차서의 시간
#      기준(대기 ≥0.3초 · 1단→2단 0.5~3초)은 그 속도를 전제로 한 값이다.
#      0.25배로 밀면 같은 장면이 6초에 걸쳐 지나가 ★그 기준이 그대로 성립한다★.
#   ② ★노드가 30fps 를 못 따라간다★ 1080p 두 번 추론이라 실측 7~10fps 다(실차도
#      같다). 30fps 로 밀면 프레임의 2/3 가 유실되어 정지선이 스치듯 지나간다.
#   판정의 초 단위 값은 (프레임 ÷ 영상fps × 배속) 으로 환산된다 = 노드가 겪은 시간.
rate: 0.25
start: 1340
limit: 90               # 1340~1429 — 정지선이 다가와 범퍼선에 닿을 때까지
stride: 1
warmup_s: 8.0
prime: 3                # ★첫 추론(3.3초)을 측정 구간 밖에서 끝낸다★ — 없으면 앞
                        #   45프레임이 통째로 유실된다(realtime 은 기다려 주지 않는다)
discard_first: 3

# ── 합성 자극 : 목업 신호등 ────────────────────────────────────────────
#   ★from 0.2 가 중요하다★ 신호등이 처음부터 보이면 RED 가 0.4초 만에 확정되는데
#   그때는 정지선이 아직 확정(sl_hold_s 0.2초) 전이라, 판정이 '정지선 미확정 → 즉시
#   2단' 으로 떨어져 ★대기·1단을 통째로 건너뛴다★(실측으로 확인). 정지선이 먼저
#   잡히기 시작한 뒤에 신호등이 나타나는 순서여야 세 단계가 다 성립한다 —
#   실차에서도 그 순서다(노면이 먼저 보이고 신호등은 교차로에 가까워져야 보인다).
overlay:
  image: assets/red_light_mock.png
  x: 880
  y: 140
  width: 240            # ★실측으로 고른 크기★ 검출률 100% (위 지그 설정 주석)
  from: 0.2             # 재생 20% 지점(프레임 ≈1358)부터 나타난다

params:
  traffic_light:
    show_window: false
    cam_undistort: false     # ⚠️ 위 주석 — 이 조건에서만 정지선이 잡힌다
    # ── ★이 영상용 두 문턱★ ─────────────────────────────────────────
    #   실측 trace(보정 OFF, 기본 사다리꼴): sl_px 가 93.5px(첫 검출) → 0px(범퍼
    #   도달)까지 45프레임(1.5초)에 걸쳐 줄어든다. 기본값 240/60 을 그대로 쓰면
    #   ★첫 검출 순간에 이미 두 문턱 안★ 이라 0단·1단을 건너뛰고 2단으로 직행한다.
    #   그래서 이 영상에서 세 단계가 다 나오도록 잡았다:
    #     RED 확정 시각(≈58px) > 35px  → 0단 대기가 성립
    #     35px 이하                    → 1단 예비제동
    #     10px 이하                    → 2단 확정 정지
    #   ★실차에서는 단계 2-C 로 잰 값을 넣는다★ — 이 숫자는 지그다.
    sl_brake1_px: 35.0
    sl_brake2_px: 10.0
    # ── ★검출 간헐성 보정★ ─────────────────────────────────────────
    #   이 영상의 정지선 검출률은 67% 다(stopline_demo_detect 실측). 노드가 7.5fps 로
    #   보는 동안 4프레임 연속으로 놓치면 0.53초이고, 기본 sl_stale_s(0.5초)를
    #   넘겨 ★'봤다가 놓쳤다' 로 판정되어 즉시 2단★ 이 된다 — 실측으로 확인했다
    #   (sl=56.9px 에서 1단을 건너뛰고 2단, 로그 [놓침]).
    #   절차서 부록 A 가 그 증상에 그대로 답을 적어 두었다:
    #     "대기가 자꾸 조기 종료된다 | sl_stale_s | 0.5 | ↑ 0.8"
    #   ⚠️ ★이것은 임계값을 느슨하게 해서 판정을 통과시키는 것이 아니다★ 검출률
    #      67% 라는 사실은 stopline_demo_detect 가 그대로 보고한다. 여기서는 그 위에서
    #      ★상태기계가 제대로 도는가★ 를 보려고 절차서가 지시한 값을 쓴 것이다.
    sl_stale_s: 0.8
    # ── ★합성 목업을 위한 지그 설정 — 세 시나리오가 같은 값을 쓴다★ ────
    #   목업 그림은 ★크기가 거리와 무관★ 하다(화면에 고정 크기로 붙인다). 그런데
    #   이 노드의 근접도 판정은 '빨간 박스 높이[px]' 를 거리의 대리값으로 쓰므로,
    #   그 두 문턱을 목업의 실제 크기에 맞춰 옮겨 놓아야 판정 경로가 성립한다.
    #   실측(폭 240px 목업, 두 구간 · 보정 ON/OFF 모두): 검출률 100%,
    #   conf 0.81~0.89, ★박스 높이 70~84px★.
    #     tl_red_stop_min_height 50  → 70~84 는 전부 RED (RED_FAR 로 안 빠진다)
    #     sl_override_gate_ratio 3.0 → 상한이 50×0.7×3.0=105px 로 84 보다 위다
    #   ⚠️ 아래 0.7 배가 무엇인지 알고 두는 값이다 — _near_gate() 는 ★물고 있는
    #      동안 게이트를 0.7배로 내린다★(해제 히스테리시스). 그래서 기본값 1.6 이면
    #      1단을 무는 순간 상한이 40px → 28px 로 떨어져, 정지선이 2단 문턱에 닿기
    #      전에 [신호등 코앞] 으로 2단이 된다(실측 확인). ★발견 사항이다★ — 실차
    #      에서는 이 값을 건드리지 말고 그대로 검사해야 한다(README §12).
    tl_red_stop_min_height: 50
    sl_override_gate_ratio: 3.0

variants:
  - {name: base, perturb: none}

# ── 판정 — ★번호도 기준값도 STOPLINE_TEST.md 단계 4 의 표와 같다★ ───────
#   배속 0.25 로 밀어 실차 접근 속도에 맞췄으므로 절차서의 시간 기준을 그대로 쓴다.
checks:
  # 기동 — 이 조건에서 무엇이 켜져 있었는지 기록으로 남는다
  - {stat: "log:boot_sl_on", min: 1, why: "정지선 기능이 켜져 있었다"}
  - {stat: "log:boot_undistort_off", min: 1,
     why: "이 시나리오는 보정을 끄고 돈다 — 켜져 있으면 정지선이 0% 다"}

  # 4-1 대기 구간이 존재하는가 (0단으로 참는 구간)
  - {where: "sl_wait", stat: run_max_s, min: 0.3,
     why: "4-1 정지선이 멀어 0단으로 참는 구간이 0.3초 이상 있어야 한다.
           없으면 첫 검출부터 이미 문턱 안이었다는 뜻이다"}
  # 4-2 대기 중에 브레이크가 섞였는가
  - {where: "sl_wait and brake_level > 0", stat: count, max: 0,
     why: "4-2 참는 동안 물렸다면 다른 발행자가 물은 것이다"}
  # 4-3 1단 체결 시각의 sl_px — 문턱 ±10px
  - {event: "brake_level:0->1", stat: count, min: 1,
     why: "4-3 1단 예비제동이 실제로 걸렸는가 (★이것이 이 기능의 핵심★)"}
  - {event: "brake_level:0->1", stat: "at:sl_px", min: 25.0, max: 45.0,
     why: "4-3 1단을 문 순간의 거리가 sl_brake1_px(35) ±10px 인가"}
  # 4-4 2단 체결 시각의 sl_px
  - {event: "brake_level:1->2", stat: count, min: 1,
     why: "4-4 1단에서 2단으로 ★승격★ 했는가 (0→2 직행이면 1단을 건너뛴 것)"}
  - {event: "brake_level:1->2", stat: "at:sl_px", min: 0.0, max: 20.0,
     why: "4-4 2단을 문 순간의 거리가 sl_brake2_px(10) ±10px 인가"}
  # 4-5 1단 → 2단 사이 시간
  - {where: "brake_level == 1", stat: run_max_s, min: 0.5, max: 3.0,
     why: "4-5 1단으로 감속한 시간. 짧으면 B1 이 가깝고(예비제동이 늦다) 길면
           멀다(정지선 한참 전부터 기어간다)"}
  # 4-6 단조 증가 — 되돌아감 0회
  - {signal: brake_level, stat: decreases, max: 1,
     why: "4-6 0→1→2 한 방향. ★해제(→0)는 1회 허용★ — 빨간불이 사라지면 놓는 것이
           정상이고, 그 외의 되돌아감은 규약 위반이다"}
  # 4-7 정지 사유 — 로그에만 있다 (sl_check.py 가 못 하던 판정)
  - {stat: "log:stop_pre", min: 1,
     why: "4-7 1단의 사유가 [예비제동] 이어야 한다"}
  - {stat: "log:stop_at_line", min: 1,
     why: "4-7 2단의 사유가 [정지선 앞] 이어야 한다 — 이것이 성공 경로다"}
  # ★'없어야 한다' 는 로그 개수로 보지 않는다★ 영상이 끝난 뒤에도 노드는 계속
  #   틱을 돌고, 프레임이 끊기면 아래 red_gone 왕복이 같은 줄을 30Hz 로 쏟아낸다.
  #   그래서 부정 판정은 ★발행된 값★ 으로 본다 — 이건 왕복하지 않는다.
  - {event: "brake_level:0->2", stat: count, max: 0,
     why: "4-7 1단을 건너뛰고 2단으로 직행했다면 정지선을 못 보고 선 것이다"}
  - {stat: "log:stop_missed", max: 0,
     why: "4-7 [놓침] 으로 섰다면 sl_brake2_px 가 너무 가깝다"}
  # 4-11 대기 상한이 발동하지 않아야 한다
  - {stat: "log:wait_cap", max: 0,
     why: "4-11 8초 상한으로 섰다면 2단 문턱에 못 닿은 것이다"}
  - {stat: "log:near_override", max: 0,
     why: "합성 목업이 너무 커서 '코앞' 으로 빠지면 정지선 경로를 못 밟는다"}

  # ⚠️ ★영상이 끝난 뒤의 로그는 이 시나리오가 판정하지 않는다★ 재생이 멈추면
  #   프레임이 끊기고, 그때 이 노드는 내부 상태를 틱 주기로 왕복시킨다(카메라 두절
  #   결함 — stopline_demo_regression 의 cam_dropout 체크가 그것을 다룬다). 그래서 여기서는
  #   '없어야 한다' 를 로그 개수로 세지 않는다(위 brake_level:0->2 가 대신한다).

  # 4-12 처리율 — realtime 이므로 유실률이 곧 실차의 그것이다
  - {stat: latency_p95_ms, max: 400,
     why: "4-12 이보다 늦으면 확정 시간(0.4s)을 못 채워 신호등에서 못 선다"}

compare_tol:
  _default: 1.0e-6
  sl_px: 4.0            # realtime 은 유실 패턴이 기계마다 달라 lockstep 보다 느슨하다
  sl_y:  0.01
  tl_near: 3.0

# ── ⚠️ ★기준(baseline)을 등록하지 않는다★ ─────────────────────────────
#   realtime 은 유실 패턴이 기계·부하마다 달라서 ★어느 프레임에 어느 값이 실리는지★
#   가 재현되지 않는다(실측: 87프레임 중 1프레임이 어긋나 max|Δsl_px| 84px).
#   프레임별 회귀 비교는 lockstep 의 일이고, 이 시나리오는 ★판정(checks)★ 으로 본다 —
#   판정은 값의 위치가 아니라 '무엇이 언제 일어났나' 를 재므로 흔들리지 않는다.
#   (회귀 비교가 필요하면 stopline_demo_detect 가 lockstep 으로 맡는다.)
