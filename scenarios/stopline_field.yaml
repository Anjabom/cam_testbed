# ══════════════════════════════════════════════════════════════════════════
#  ★실차 카메라로 찍은 영상용★ — 정지선 앞 정지 시험 (STOPLINE_TEST.md)
# ══════════════════════════════════════════════════════════════════════════
#  이 파일이 새 영상의 기본 출발점이다. `stopline_demo_*` 와 다른 점은 셋이다:
#    · 합성 목업을 ★쓰지 않는다★ — 실제 신호등(또는 삼각대 목업)이 찍혀 있어야 한다
#    · 근접도·확정 시간 문턱을 ★건드리지 않는다★ — 노드 기본값 그대로 검사한다
#    · 두 문턱도 노드 기본값으로 두고, ★단계 2 실측 후에 여기에 적는다★
#
#  ── 쓰는 순서 (웹앱 «테스트 준비» 가 이 순서로 안내한다) ─────────────
#   ① 영상 등록      «실행 → 등록» 에서 논리 이름을 붙인다 → 아래 video: 를 그 이름으로
#   ② 구간 고르기    limit: 0(전체)로 한 번 돌리고 «프레임 탐색»의 «정지선 검출» 로
#                    잡히는 구간을 찾아 start/limit 을 좁힌다
#   ③ 카메라 맞추기  «카메라 보정» 에서 사다리꼴 → 범퍼선 → 두 문턱 (단계 2)
#                    ★«워크스페이스 기본값 불러오기»로 노드 값에서 출발할 것★
#   ④ 판정           아래 checks 는 절차서 단계 1·4 의 기준 그대로다
#
#  ⚠️ ★이 영상이 실차 카메라로 찍힌 것인지 확인하고 쓸 것★ 카메라 위치·화각이 다르면
#     BEV 로 잰 거리가 실차와 다른 값이 되고, 그 값으로 문턱을 잡으면 실차에서 틀린다.
# ══════════════════════════════════════════════════════════════════════════
name: stopline_field
contract: contracts/white1_stopline.yaml

# ★새로 등록한 영상의 논리 이름으로 바꾼다★ (local.yaml 의 videos:)
video: field

# ── 재생 ───────────────────────────────────────────────────────────────
#   ★realtime 이다★ 이 노드의 판단은 전부 벽시계로 돈다(tl_hold_s 0.4s ·
#   sl_hold_s 0.2s · sl_stale_s 0.5s · sl_wait_max_s 8s). lockstep 은 프레임당
#   처리시간이 그대로 흘러 그 상수들이 뜻을 잃는다 — 시간 판정은 realtime 뿐이다.
#   (검출률만 회귀로 보고 싶으면 mode: lockstep 으로 따로 한 번 더 돌린다.)
mode: realtime
rate: 1.0               # 실차 속도 그대로. 접근이 너무 빨라 판정이 안 되면 0.5·0.25 로
start: 0
limit: 0                # 0 = 끝까지. 구간을 좁힌 뒤에는 프레임 번호로 바꾼다
stride: 1
warmup_s: 10.0
prime: 3                # ★첫 추론(3.3초)을 측정 구간 밖에서★ — realtime 에서는 필수
discard_first: 3

params:
  traffic_light:
    show_window: false
    # ── ★여기는 비워 둔다★ ─────────────────────────────────────────
    #   단계 2(카메라 보정 탭)에서 잰 값을 «저장» 하면 이 자리에 들어온다:
    #     bev_src_pts · bev_bumper_y_px · bev_px_to_m
    #     sl_brake1_px · sl_brake2_px
    #   그때까지는 노드 기본값으로 돈다 — 절차서가 "근거 없는 값"이라고 못 박은
    #   그 값이므로, ★문턱 판정(4-3·4-4)은 실측 뒤에 의미를 갖는다★.
    #
    #   가중치·device 는 local.yaml 에 있다(기계에 묶인 값이라서).

variants:
  - {name: base, perturb: none}

# ── 판정 — STOPLINE_TEST.md 단계 1·4 의 기준 그대로 ────────────────────
checks:
  # ── 단계 0 : 노드가 제대로 떴는가 ───────────────────────────────────
  - {stat: "log:boot_sl_class", min: 1,
     why: "0-1 정지선 클래스표에 stop-line 이 있고 그 id 를 쓴다"}
  - {stat: "log:boot_sl_on", min: 1,
     why: "0-2 정지선 배너가 나온다"}
  - {stat: "log:boot_undistort_on", min: 1,
     why: "0-3 카메라 보정 ON — OFF 면 BEV 거리를 믿을 수 없다"}
  - {stat: "log:boot_weight_fail", max: 0,
     why: "0-1 .engine 은 빌드한 GPU 에 묶인다 — 이 기계에서는 .pt 를 줄 것"}
  - {stat: "log:boot_class_missing", max: 0,
     why: "★여기서 멈춘다★ 다른 클래스를 정지선으로 읽으면 엉뚱한 곳에서 선다"}

  # ── 단계 1 : ★관문★ 정지선이 잡히는가 ──────────────────────────────
  - {where: "sl_px >= 0", stat: frac, min: 0.30,
     why: "1-1 정지선이 잡히는 프레임 비율. 구 white 는 100% 미검출이었다"}
  - {where: "sl_px >= 0", stat: run_max_s, min: 0.5,
     why: "1-1 ★끊기지 않고 계속★ 잡히는가. 스치듯 잡히면 sl_hold_s(0.2s)를 못 채운다"}
  - {signal: sl_px, where: "sl_px >= 0", stat: p95_abs_diff, max: 60.0,
     why: "2-3 거리가 프레임마다 튀면 문턱을 넘나든다"}

  # ── 신호등이 찍혀 있는가 (정지선 관문이 열리는 조건) ────────────────
  - {where: "tl_state == 'RED' or tl_state == 'RED_FAR'", stat: frac, min: 0.10,
     why: "빨간불을 본 프레임이 있어야 정지선 추론이 돈다(_sl_should_run).
           0 이면 신호등이 안 찍힌 영상이다 — 그러면 단계 1 도 못 본다"}
  - {where: "tl_state == 'RED'", stat: run_max_s, min: 0.4,
     why: "RED 가 tl_hold_s(0.4초) 이상 이어져야 확정된다. 짧으면 근접도 게이트에
           걸려 RED_FAR 로 빠지는 것이다(tl_red_stop_min_height 재실측 대상)"}

  # ── 단계 4 : 판정표 ★두 문턱을 실측해 넣은 뒤에 의미를 갖는다★ ──────
  - {where: "sl_wait", stat: run_max_s, min: 0.3,
     why: "4-1 정지선이 멀어 0단으로 참는 구간이 0.3초 이상"}
  - {where: "sl_wait and brake_level > 0", stat: count, max: 0,
     why: "4-2 참는 동안 물렸다면 다른 발행자가 물은 것이다"}
  - {event: "brake_level:0->1", stat: count, min: 1,
     why: "4-3 1단 예비제동이 걸렸는가 ★이 기능의 핵심★"}
  - {event: "brake_level:1->2", stat: count, min: 1,
     why: "4-4 1단 → 2단 승격. 0→2 직행이면 1단을 건너뛴 것이다"}
  - {event: "brake_level:0->2", stat: count, max: 0,
     why: "4-7 2단 직행 = 정지선을 못 보고 그 자리에서 섰다"}
  - {where: "brake_level == 1", stat: run_max_s, min: 0.5, max: 3.0,
     why: "4-5 1단 감속 시간. 짧으면 B1 이 가깝고 길면 멀다"}
  - {signal: brake_level, stat: decreases, max: 1,
     why: "4-6 0→1→2 한 방향. 해제(→0)는 1회 허용"}
  - {stat: "log:stop_pre", min: 1,
     why: "4-7 1단의 사유가 [예비제동]"}
  - {stat: "log:stop_at_line", min: 1,
     why: "4-7 2단의 사유가 [정지선 앞] — 이것이 성공 경로다"}
  - {stat: "log:stop_missed", max: 0,
     why: "4-7 [놓침] 으로 섰다면 sl_brake2_px 가 너무 가깝다"}
  - {stat: "log:wait_cap", max: 0,
     why: "4-11 8초 상한으로 섰다면 2단 문턱에 못 닿은 것이다"}
  - {stat: "log:near_override", max: 0,
     why: "[신호등 코앞] 으로 섰다면 정지선을 기다리지 않은 것이다.
           ⚠️ 1단을 물면 상한이 40px → 28px 로 내려간다(README §12 ③)"}

  # ── 4-12 처리율 ─────────────────────────────────────────────────────
  - {stat: latency_p95_ms, max: 400,
     why: "4-12 이보다 늦으면 확정 시간(0.4s)을 못 채워 신호등에서 못 선다"}

# ── ⚠️ ★기준(baseline)을 등록하지 않는다★ ─────────────────────────────
#   realtime 은 유실 패턴이 기계·부하마다 달라서 ★어느 프레임에 어느 값이 실리는지★
#   가 재현되지 않는다(실측: 87프레임 중 1프레임이 어긋나 max|Δsl_px| 84px).
#   프레임별 회귀 비교는 lockstep 의 일이고, 이 시나리오는 ★판정(checks)★ 으로 본다 —
#   판정은 값의 위치가 아니라 '무엇이 언제 일어났나' 를 재므로 흔들리지 않는다.
#   (회귀 비교가 필요하면 stopline_demo_detect 가 lockstep 으로 맡는다.)

# ── 회귀 허용오차 ──────────────────────────────────────────────────────
compare_tol:
  _default: 1.0e-6
  sl_px: 4.0            # realtime 은 유실 패턴이 기계마다 달라 lockstep 보다 느슨하다
  sl_y:  0.01
  tl_near: 3.0
