# ※ 옛 시나리오에서 옮겨 온 프리셋이다 — 판정(checks)·회귀 허용오차는
#   더 이상 YAML 에 없다(잰 값을 사람이·클로드가 읽는다).
#   프리셋이 담는 것은 ★재생 조건★ 뿐이다: 영상·구간·모드·파라미터.
# ★realtime_lane_night_a★ — presets/lane_night_a.yaml 를 본으로 떠서 만들었다 (2026-08-31 14:07)
#   영상 night_a (/home/anjabom/video/cam-20260824_201445.mp4)
#   실차 카메라로 촬영: 예
#   ⚠️ 본의 판정 기준을 그대로 물려받았다 — 이 영상에 맞는지 확인할 것.
# 차선 알고리즘(perception + camera_judgment) 시험 — 실차 야간 영상 A
#   regression.yaml 은 실내 모형 트랙(track_a) 용이라 차선폭 규격이 다르다.
#   이 파일은 실차 카메라로 찍은 실도로 영상이라 local.yaml 의 실차 기본값
#   (lane_width_m 3.0, width_min/max 는 노드 기본값)을 그대로 쓴다 — 덮어쓰지 않는다.

name: realtime_lane_night_a
contract: contracts/white_camera.yaml
video: /home/mad2/video/night_a.mp4
mode: realtime
start: 0
limit: 0
stride: 1
warmup_s: 8.0
sync_timeout: 4.0
discard_first: 5
params:
  perception:
    show_window: false
    record_video: false
    enable_undistort: true
    ipm_src_pts: [720.0, 650.0, 1200.0, 650.0, 1920.0, 1080.0, 0.0, 1080.0]
    lane_roi_xmin: 0
    lane_roi_ymin: 600
    lane_roi_xmax: 1920
    lane_roi_ymax: 1080
    tl_roi_xmin: 0
    tl_roi_ymin: 0
    tl_roi_xmax: 1920
    tl_roi_ymax: 600
    pixel_to_meter_bev: 0.007
    lane_width_m: 3.0
  camera_judgment: {pixel_to_meter_bev: 0.007, lane_width_m: 3.0}
