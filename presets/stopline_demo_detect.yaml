# ※ 옛 시나리오에서 옮겨 온 프리셋이다 — 판정(checks)·회귀 허용오차는
#   더 이상 YAML 에 없다(잰 값을 사람이·클로드가 읽는다).
#   프리셋이 담는 것은 ★재생 조건★ 뿐이다: 영상·구간·모드·파라미터.
# ══════════════════════════════════════════════════════════════════════════
#  ⚠️ ★이것은 track_record.mp4 전용 「지그」다★ — 실차 판정용이 아니다
# ══════════════════════════════════════════════════════════════════════════
#  이 파일의 프레임 구간·목업 크기·두 문턱·근접도 문턱은 전부 ★그 영상 하나에서
#  뽑은 값★ 이다. 그 영상은 실차와 카메라 위치·화각이 다르므로, 여기서 나온 숫자로
#  white1 을 튜닝하면 안 된다(2026-08-19 지시).
#
#  ★그럼 왜 남겨 두는가★ 둘이다:
#    ① 테스트베드 자신의 회귀 — 판정 엔진·계약·화면이 성한지 매번 확인한다
#    ② README §12 의 발견 사항 4개를 ★다시 돌려 볼 수 있는 유일한 절차★ 다
#
#  ★실차 카메라로 찍은 새 영상은 presets/stopline_field.yaml 로 돌린다★
#  (그쪽은 합성 목업도, 이 영상용 지그 값도 쓰지 않는다)
# ══════════════════════════════════════════════════════════════════════════
# ══════════════════════════════════════════════════════════════════════════
#  단계 1 — ★정지선이 화면에 잡히는가★  (STOPLINE_TEST.md 의 관문)
# ══════════════════════════════════════════════════════════════════════════
#  절차서가 못을 박아 둔 그대로다:
#     "구 white 실측에서 stop_line_dist 는 100% 미검출이었다. ★여기서 안 잡히면
#      나머지 단계는 할 필요가 없다★ — sl_enable:=false 로 두고 접으면 종전 동작이다."
#  그 질문을 차를 꺼내지 않고 ★영상 하나로★ 묻는다.
#
#  ★고른 구간의 근거★ track_record.mp4 의 1354~1402 프레임에 실제 정지선 접근이
#  있다(사전 스캔: 검출이 거의 매 프레임, 마스크 최하단 y 가 804 → 1080 으로 단조
#  증가 = 다가가는 중). 그 앞뒤를 조금씩 물려 1340~1429 를 본다.
#
#  ★왜 목업 신호등을 합성하는가★ 이 노드는 ★빨간 박스를 본 적이 있어야만★ 정지선
#  추론을 돌린다(_sl_should_run 이 red_seen_t > 0 을 요구한다). 손에 있는 영상에는
#  신호등이 없으므로 sl_gate_red_s 를 아무리 크게 줘도 관문이 안 열린다
#  (⚠️ 절차서 단계 1 의 `sl_gate_red_s:=99999.0` 한 줄로는 부족하다 — README §12).
#  실차 절차의 '삼각대에 목업 신호등' 을 화면 합성으로 대신한다.
# ══════════════════════════════════════════════════════════════════════════

name: stopline_demo_detect
contract: contracts/white1_stopline.yaml
video: /home/anjabom/track_record.mp4
mode: lockstep
start: 1340
limit: 90
stride: 1
warmup_s: 15.0
sync_timeout: 8.0
sync_settle_ms: 60
discard_first: 5
sim_time: false
params:
  traffic_light: {show_window: false, sl_gate_red_s: 99999.0, tl_red_stop_min_height: 50, sl_override_gate_ratio: 3.0}
overlay: {image: assets/red_light_mock.png, x: 880, y: 140, width: 240}
