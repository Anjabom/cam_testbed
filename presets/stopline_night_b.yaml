# ※ 옛 시나리오에서 옮겨 온 프리셋이다 — 판정(checks)·회귀 허용오차는
#   더 이상 YAML 에 없다(잰 값을 사람이·클로드가 읽는다).
#   프리셋이 담는 것은 ★재생 조건★ 뿐이다: 영상·구간·모드·파라미터.
# ══════════════════════════════════════════════════════════════════════════
#  실차 야간 영상 B — ★정지선 「오검출」 시험★ (STOPLINE_TEST.md 단계 0·1)
# ══════════════════════════════════════════════════════════════════════════
#  ★이 프리셋가 묻는 것은 stopline_field 와 반대다★
#
#    stopline_field  : "정지선이 있는데 잡는가"         (검출 시험)
#    이 파일          : "정지선이 없는데 잡았다고 하는가" (오검출 시험)
#
#  ★night_a 와 같은 파일이다★ 영상만 다르다 — 같은 밤, 같은 차, 같은 카메라로
#  이어서 찍은 두 번째 클립이다. 둘 다 돌리는 이유는 오검출이 ★어느 장면에서★
#  나는지를 보려는 것이다(횡단보도 모양·조명·노면이 구간마다 다르다).
#
#  ── 왜 반대인가 ────────────────────────────────────────────────────────
#  이 영상(night_b)에는 ★정지선이 없다★. 25프레임 균등 샘플로 전 구간을 훑어
#  확인했다 — 야간 캠퍼스 도로이고 ★횡단보도만★ 여러 번 나온다. 그리고
#  ★신호등도 한 번도 안 나온다★.
#
#  그래서 stopline_field 의 단계 1 판정(`sl_px >= 0` 이 30% 이상)을 그대로 쓰면
#  ★통과하는 것이 곧 실패★ 가 된다 — 없는 정지선을 잡았다는 뜻이기 때문이다.
#  절차서가 1-3(차체 오검출)·1-4(횡단보도 오검출)로 경계한 바로 그 상황이다.
#  판정을 뒤집은 것이지 ★느슨하게 한 것이 아니다★.
#
#  ⚠️ ★이 파일의 checks 를 stopline_field 로 되가져가지 말 것★ 그쪽은 정지선이
#     실제로 찍힌 영상용이고, 그때는 검출률 하한이 옳다. 두 파일은 서로 다른
#     질문이다.
#
#  ── 정지선이 있는 영상을 찍으면 ──────────────────────────────────────
#  «테스트 준비» 에서 `stopline_field.yaml` 을 본떠 새로 만든다. 이 파일이
#  아니다.
# ══════════════════════════════════════════════════════════════════════════

name: stopline_night_b
contract: contracts/white1_stopline.yaml
video: /home/mad2/video/night_b.mp4
mode: lockstep
