    lane_roi_xmax: 1920
    lane_roi_ymax: 1080
    tl_roi_xmin: 0
    tl_roi_ymin: 0
    tl_roi_xmax: 1920
    tl_roi_ymax: 600
    pixel_to_meter_bev: 0.006
    lane_width_m: 3.0
  camera_judgment: {pixel_to_meter_bev: 0.006, lane_width_m: 3.0}
aux_schedule:
  /tl/fake_box_h: {331: 15.0, 385: 40.0, 443: 0.0, 632: 15.0, 692: 40.0, 756: 0.0}
