# ※ 옛 시나리오에서 옮겨 온 프리셋이다 — 판정(checks)·회귀 허용오차는
#   더 이상 YAML 에 없다(잰 값을 사람이·클로드가 읽는다).
#   프리셋이 담는 것은 ★재생 조건★ 뿐이다: 영상·구간·모드·파라미터.
# lane_vote 차선 알고리즘 시험 — ★실차 타이밍★ 판 (영상 night_a)
#   vote_night_a.yaml 의 realtime 짝이다. 영상·계약·판정 기준을 그대로 물려받고
#   ★재생 모드만★ 바꿨다 — 그래야 "lockstep 에서 좋던 것이 30fps 실차에서도
#   좋은가"라는 질문 하나만 남는다.
#
#   ★왜 따로 도는가★ lockstep 은 한 프레임 밀고 응답을 기다리므로 노드가 느려도
#   모든 프레임을 정확히 한 번씩 본다. 실차 카메라는 기다려 주지 않는다 —
#   30fps 로 계속 밀고, 노드가 못 따라오면 그 프레임은 그냥 없어진다.
#   lane_vote 는 이전 프레임의 해를 씨앗으로 쓰는 국소 탐색(15프레임마다 전역
#   재탐색)이라, ★프레임이 새면 씨앗과 현재 장면의 간격이 벌어진다★.
#   그 간격이 추정 품질을 얼마나 깎는지는 realtime 으로만 잴 수 있다.
#
#   ⚠️ ★기준(baseline)을 등록하지 않는다★ (README §13.7) — 유실 패턴이 기계·부하마다
#      달라 어느 프레임에 어느 값이 실리는지가 재현되지 않는다. 프레임별 회귀는
#      lockstep(vote_night_a)의 일이고, 이 파일은 ★판정(checks)★ 으로만 본다.
#      그래서 compare_tol: 도 두지 않았다.

name: vote_realtime_night_a
contract: contracts/white_vote.yaml
video: /home/mad2/video/night_a.mp4
mode: realtime
rate: 1.0
start: 0
limit: 0
stride: 1
warmup_s: 8.0
sync_timeout: 4.0
prime: 3
discard_first: 5
params:
  perception: {show_window: false, record_video: false, enable_undistort: true}
  camera_judgment: {}
