prime: 3
discard_first: 3
params:
  traffic_light: {show_window: false, cam_undistort: false, sl_brake1_px: 35.0, sl_brake2_px: 10.0, sl_stale_s: 0.8,
    tl_red_stop_min_height: 50, sl_override_gate_ratio: 3.0}
overlay: {image: assets/red_light_mock.png, x: 880, y: 140, width: 240, from: 0.2}
