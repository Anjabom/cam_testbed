<!-- 카메라 보정 스튜디오 — 같은 파일이 두 곳에서 돈다.
     github.io (서버 없음): 영상은 ★이 브라우저 안에서만★ 열리고 아무 데도 올라가지
       않는다. mp4v 는 페이지 안의 wasm 이 푼다(mp4frames.js · vendor/mpeg4dec.js).
     tb.run studio (127.0.0.1): 이 기계의 폴더를 훑고 프레임을 cv2 로 받는다.
     계약도 프로필도 없다: 맞출 것은 tuning.js 한 곳이 정한다. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카메라 보정 스튜디오</title>
<link rel="stylesheet" href="style.css">

<header>
  <h1>카메라 보정 스튜디오</h1>
  <div class="io">
    <!-- ★열기는 한 갈래다★ 서버가 있으면 이 기계의 폴더를 훑고(cv2),
         없으면 이 브라우저가 고른 폴더(Chrome·Edge)나 파일을 연다(mp4v 는 wasm). -->
    <button class="btn primary" id="open">영상·사진 열기</button>
    <input type="file" id="file" accept="video/*,image/*" hidden>
    <label class="btn">불러오기
      <input type="file" id="loadf" accept=".json,application/json" hidden>
    </label>
    <button class="btn" id="save">내보내기</button>
    <button class="btn" id="reset">기본값으로</button>
  </div>
</header>

<div id="banner" hidden></div>

<main>
  <section id="panes">
    <div class="pane">
      <h2>원본 <small>왜곡보정 후 · 사각형과 ROI 를 여기서 끈다</small></h2>
      <canvas id="srcC" width="640" height="360"></canvas>
    </div>
    <div class="pane">
      <h2>BEV <small>노드가 만드는 것과 같은 변환</small></h2>
      <canvas id="bevC" width="320" height="500"></canvas>
    </div>
  </section>

  <aside id="side">
    <div id="targets"></div>
    <p id="hint" class="hint"></p>
    <div id="extra"></div>
    <div id="values"></div>
  </aside>
</main>

<div id="timeline" hidden>
  <button class="btn sm" id="back">◀</button>
  <input type="range" id="seek" min="0" max="1000" value="0">
  <button class="btn sm" id="fwd">▶</button>
  <span id="tpos" class="mono"></span>
</div>

<!-- 단축키를 화면에 적어 둔다 — 안 적으면 아무도 모른다(옛 웹앱도 그랬다) -->
<div id="keys" class="mono">단축키 — <b>스페이스</b> 재생/정지 · <b>, .</b> 한 프레임 ·
  <b>[ ]</b> 30프레임 · <b>방향키</b> 1px · <b>Shift+방향키</b> 10px ·
  <b>1~9</b> 편집 대상 · <b>g</b> 격자 · <b>u</b> 왜곡보정 · <b>r</b> 되돌리기 ·
  <b>Esc</b> 선택 해제</div>

<footer>
  <span id="foot"></span>
  <span class="sp"></span>
  <span id="check" class="mono"></span>
</footer>

<script src="geom.js"></script>
<script src="reference.js"></script>
<script src="render.js"></script>
<script src="mp4frames.js"></script>
<script src="tuning.js"></script>
<script src="app.js"></script>
